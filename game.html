<!doctype html>
<html lang="en" data-theme="harbour-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse Keepers · one night at the harbour</title>
<link rel="stylesheet" href="lighthouse-keepers-handoff/design-system/tokens.css">
<link rel="stylesheet" href="lighthouse-keepers-handoff/design-system/reference/lk-kit.css">
<script src="lighthouse-keepers-handoff/design-system/reference/lk-kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-read); }
  * { box-sizing: border-box; }
  /* the game fills the screen at a whole-number scale; any leftover edge is a thin dark border */
  body { height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--outline); }
  .hidden { display: none !important; }
  .scene, .dawn, .lk-btn { font-variant-ligatures: none; }

  /* ---------- Keeper's screen: scene + HUD (copied from the design system's Game HUD) ---------- */
  .scene { position: relative; }
  .scene canvas { display: block; }
  .hud { position: absolute; font-family: var(--font-pixel); }
  .hud.lk-panel { padding: var(--space-2) var(--space-4); }
  .tl { top: var(--space-4); left: var(--space-4); }
  .tl .tidebox { padding: var(--space-2) var(--space-4); }
  .tr { top: var(--space-4); right: var(--space-4); text-align: center; }
  .bl { bottom: var(--space-4); left: var(--space-4); display: flex; align-items: center; gap: var(--space-2); }
  .br { bottom: var(--space-4); right: var(--space-4); display: flex; align-items: flex-end; gap: var(--space-2); max-width: 380px; }
  .tide { font-size: 28px; line-height: 32px; font-weight: 600; }
  .ticks { display: flex; gap: var(--space-1); margin-top: var(--space-1); }
  .ticks i { width: 24px; height: 8px; background: var(--border); position: relative; overflow: hidden; }
  .ticks i.on { background: var(--success); }
  .ticks i b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--success); }
  .pips { display: flex; gap: var(--space-2); justify-content: center; margin-top: var(--space-1); }
  .pip { width: 16px; height: 16px; transform: rotate(45deg); box-shadow: 0 0 0 4px var(--outline); background: var(--surface); margin: 6px; transition: background 1s; }
  .pip.on { background: var(--beam); }
  .small { font-size: 16px; line-height: 22px; }
  .bubble { font-size: 20px; line-height: 26px; }
  .bubble .frost { display: flex; align-items: center; gap: var(--space-2); }

  /* Dawn summary + decorations shop: child-facing pixel panel */
  .dawn { position: absolute; top: var(--space-4); right: var(--space-4); width: min(460px, 50%);
    max-height: calc(100% - 32px); overflow: auto; font-family: var(--font-pixel); }
  .dawn h1 { margin: 0 0 var(--space-1); }
  .dawn .big { font-size: 22px; line-height: 28px; margin: 0 0 var(--space-1); }
  .dawn .up { color: var(--success); font-size: 18px; line-height: 24px; display: flex; gap: var(--space-2); margin: 0 0 var(--space-2); }
  .dawn .same { font-size: 18px; line-height: 24px; margin: 0 0 var(--space-2); }
  .stars { display: flex; gap: var(--space-2); align-items: center; font-size: 20px; line-height: 26px; margin-bottom: var(--space-2); }
  .dawn .news { font-size: 18px; line-height: 24px; margin: 0 0 var(--space-1); }
  .dawnBtns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-4); }
  .dawnBtns .lk-btn { display: flex; align-items: center; gap: var(--space-2); font-size: 18px; text-align: left; }
  .dawn .goodnight { display: block; width: calc(100% - 2 * var(--space-1)); margin-top: var(--space-4); }

  /* top-right menu: Shop + icon buttons, all one height */
  .trc { top: var(--space-4); right: var(--space-4); display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2); }
  .menu { display: flex; gap: var(--space-1); align-items: stretch; }
  .menu .lk-btn { height: 48px; }
  .shopBtn { display: flex; align-items: center; gap: var(--space-2); font-size: 18px; padding: 0 12px; }
  .iconBtn { display: flex; align-items: center; justify-content: center; padding: 0 10px; }
  [data-icon] { display: flex; }
  .shopBtn .cnt { display: flex; align-items: center; gap: 4px; font-size: 16px; background: var(--surface); color: var(--ink); padding: 0 6px; }

  /* full-screen child screens: shop, decorate, logbook, rescue album (drawn for a 960x540 stage) */
  #over { position: fixed; inset: 0; z-index: 10; background: var(--surface); display: flex; overflow: auto; }
  .sheet { margin: auto; flex: none; position: relative; width: 960px; height: 540px; display: flex; flex-direction: column; font-family: var(--font-pixel); color: var(--ink); }
  .snav { display: flex; gap: var(--space-2); padding: var(--space-2) var(--space-4) 0; }
  .ntab { display: flex; align-items: center; gap: 6px; font-family: var(--font-pixel); font-size: 16px; line-height: 20px; padding: 3px 10px; border: 2px solid var(--border); background: var(--surface-raised); color: var(--ink); cursor: pointer; }
  .ntab.on { background: var(--accent); color: var(--on-accent); border-color: var(--outline); cursor: default; }
  .sheet .bar { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-4); }
  .sheet .bar h1 { margin: 0; flex: 1; }
  .sheet .bar .lk-btn { font-size: 18px; padding: 4px 14px 8px; }
  .sheet .bar .sum { font-size: 18px; color: var(--ink-muted); }
  .purse { display: flex; align-items: center; gap: var(--space-2); font-size: 22px; padding: 4px 14px; }
  .purse small { font-size: 14px; color: var(--ink-muted); }
  .awning { height: 28px; width: 960px; display: block; image-rendering: pixelated; }
  .shopMain { flex: 1; display: grid; grid-template-columns: 150px 1fr 250px; gap: var(--space-2); padding: 0 var(--space-4) var(--space-4); min-height: 0; }
  .cats { display: flex; flex-direction: column; gap: 4px; }
  .cat, .tab { display: flex; align-items: center; gap: 6px; font-family: var(--font-pixel); font-size: 17px; line-height: 20px; padding: 3px 6px; border: 2px solid var(--border); background: var(--surface-raised); color: var(--ink); cursor: pointer; text-align: left; }
  .cat.on, .tab.on { background: var(--accent); color: var(--on-accent); border-color: var(--outline); }
  .cat canvas { image-rendering: pixelated; }
  .igrid { overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); align-content: start; padding: 2px; }
  .it { border: 2px solid var(--border); background: var(--surface-raised); padding: 6px; text-align: center; cursor: pointer; position: relative; color: var(--ink); font: inherit; }
  .it.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .it canvas { width: 100%; height: auto; image-rendering: pixelated; display: block; }
  .it .n { font-size: 16px; line-height: 18px; margin-top: 4px; }
  .price { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 16px; }
  .owned { color: var(--success); font-size: 14px; }
  .short { opacity: .55; }
  .tag { position: absolute; top: 3px; right: 3px; font-size: 11px; padding: 0 4px; background: var(--stripe); color: var(--tower); }
  .preview { padding: var(--space-2); margin: var(--space-1); display: flex; flex-direction: column; gap: 6px; }
  .preview canvas { width: 100%; height: auto; image-rendering: pixelated; display: block; }
  .preview h2 { margin: 0; font-size: 22px; line-height: 26px; }
  .preview p { margin: 0; font-family: var(--font-read); font-size: 14px; line-height: 19px; color: var(--ink-muted); }
  .preview .lk-btn { margin-top: auto; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 6px 16px; font-size: 18px; font-family: var(--font-pixel); z-index: 11; }

  .decBody { flex: 1; display: grid; grid-template-columns: 420px 1fr; gap: var(--space-4); padding: 0 var(--space-4); min-height: 0; }
  #decScene { width: 420px; height: 360px; image-rendering: pixelated; display: block; cursor: pointer; }
  .hint { font-family: var(--font-read); font-size: 14px; color: var(--ink-muted); margin: var(--space-2) 0 0; }
  .bag { padding: var(--space-2); margin: var(--space-1); display: flex; flex-direction: column; min-height: 0; }
  .bag h2 { font-size: 22px; line-height: 26px; margin: 0 0 var(--space-2); display: flex; justify-content: space-between; align-items: baseline; }
  .bag h2 small { font-family: var(--font-read); font-size: 13px; font-weight: 400; color: var(--ink-muted); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: var(--space-2); }
  .tab { font-size: 16px; padding: 2px 8px; background: var(--surface); }
  .bgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); overflow-y: auto; padding: 2px; }
  .bi { border: 2px solid var(--border); background: var(--surface); padding: 6px; text-align: center; position: relative; }
  .bi.placed { border-color: var(--success); }
  .bi canvas { width: 100%; height: auto; image-rendering: pixelated; display: block; }
  .bi .n { font-size: 16px; line-height: 20px; margin: 4px 0; }
  .bi button { width: 100%; font-family: var(--font-pixel); font-size: 16px; line-height: 20px; padding: 4px; border: 2px solid var(--outline); cursor: pointer; background: var(--accent); color: var(--on-accent); }
  .bi.placed button { background: var(--surface-raised); color: var(--ink); }
  .on-badge { position: absolute; top: 4px; left: 4px; font-size: 13px; padding: 0 4px; background: var(--success); color: var(--surface); }
  .slotline { font-family: var(--font-read); font-size: 13px; color: var(--ink-muted); }
  .empty { font-family: var(--font-read); font-size: 16px; color: var(--ink-muted); }

  .scroll { flex: 1; overflow-y: auto; padding: 0 var(--space-4) var(--space-4); }
  .scroll h2 { font-size: 20px; line-height: 26px; margin: var(--space-2) 0; }
  .lgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
  .bdg { display: grid; grid-template-columns: 60px 1fr; gap: var(--space-2); align-items: center; padding: var(--space-2); background: var(--surface-raised); border: 2px solid var(--border); }
  .bdg.done { border-color: var(--success); }
  .bdg canvas { image-rendering: pixelated; display: block; }
  .bdg .n { font-size: 16px; line-height: 20px; }
  .bdg .t { font-family: var(--font-read); font-size: 14px; line-height: 18px; color: var(--ink-muted); }
  .segs { display: flex; gap: 2px; margin-top: 4px; }
  .segs i { flex: 1; height: 6px; background: var(--border); }
  .segs i.on { background: var(--success); }
  .bdg .cnt { font-size: 14px; color: var(--ink-muted); }
  .bdg.done .cnt { color: var(--success); }

  .book { display: grid; grid-template-columns: 1fr 1fr; margin: 0 var(--space-4) var(--space-4); border: 4px solid var(--border); background: var(--surface-raised); flex: 1; min-height: 0; }
  .page { padding: var(--space-2) var(--space-4); overflow-y: auto; }
  .page + .page { border-left: 4px dashed var(--border); }
  .page h2 { font-size: 20px; margin: 0 0 var(--space-2); }
  .sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-bottom: var(--space-2); }
  .st { text-align: center; padding: 6px 4px; background: var(--surface); border: 2px solid var(--border); }
  .st.met { border-color: var(--lamp); }
  .st canvas { image-rendering: pixelated; display: block; margin: 0 auto; }
  .st div { font-size: 16px; line-height: 18px; margin-top: 4px; }
  .st small { display: block; font-family: var(--font-read); font-size: 13px; line-height: 16px; color: var(--ink-muted); }
  .st.unmet div { color: var(--ink-muted); }

  .pause { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; font-family: var(--font-pixel); }

  button:focus-visible, input:focus-visible { outline: var(--space-1) solid var(--ink); outline-offset: var(--space-2); }
</style>
</head>
<body>

<div class="scene" id="scene">
  <canvas id="c" class="lk-pixel-canvas" aria-label="Pixel-art harbour at night: a lighthouse shines a beam through fog to guide boats home"></canvas>

  <div class="hud tl" id="hudTL">
    <div class="lk-panel tidebox"><div class="tide" id="stageName">Lamp lighting</div><div class="ticks" id="ticks"><i><b></b></i><i><b></b></i><i><b></b></i></div></div>
  </div>
  <div class="hud tr lk-panel" id="hudTR"><div class="small">Steady beams</div><div class="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div></div>
  <div class="hud bl lk-panel" id="hudBL"><span id="boatIcon"></span><span class="small" id="homeText">0 home</span></div>
  <div class="hud br" id="hudBR"><span id="guideAvatar"></span><div class="lk-panel bubble" id="bubble" aria-live="polite"></div></div>

  <!-- top right between rounds and after the night (the Keeper has no input during a round) -->
  <div class="hud trc" id="hudTRC">
    <div class="menu" id="menu">
      <button class="lk-btn shopBtn" id="shopBtn" data-open="shop"><span data-icon="shop"></span>Shop <span class="cnt"><span class="si"></span><span id="starCnt">0</span></span></button>
      <button class="lk-btn secondary iconBtn" data-open="decorate" aria-label="Decorate" title="Decorate"><span data-icon="decorate"></span></button>
      <button class="lk-btn secondary iconBtn" data-open="logbook" aria-label="Logbook" title="Logbook"><span data-icon="logbook"></span></button>
      <button class="lk-btn secondary iconBtn" data-open="album" aria-label="Rescue album" title="Rescue album"><span data-icon="album"></span></button>
    </div>
    <div class="lk-panel small hidden" id="hudHint" style="max-width:360px"></div>
  </div>
  <div class="dawn lk-panel hidden" id="dawn"></div>
  <div class="pause lk-panel hidden" id="pause"><div class="game-heading">Paused</div><div class="small">Press Esc to carry on.</div></div>
</div>
<div id="over" class="hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast lk-panel hidden" id="toast" role="status"></div>

<script>
'use strict';
// ---------- Config (open design decisions stay as values) ----------
const CFG = {
  // Palette per stage. The Storm Ship climax uses Deep Fjord.
  stagePalettes: { lighting: 'harbour-night', calm: 'sea-glass', tide: 'sea-glass', rest: 'sea-glass',
                   storm: 'deep-fjord', dawn: 'harbour-night', end: 'harbour-night' },
  highContrastTheme: 'storm-ink',        // accessibility switch overrides every stage
  lighthouse: 'classic', fog: 'bands',   // fog: bands | dither | clouds
  threshold: 45, holdSec: 3,             // attention 0–100; seconds above threshold for a steady beam
  easeSec: 1, frostAbove: 50, steadyForFlare: 3, flareSec: 10,
  tides: 3,
  durations: { calm: 60, tide: 180, stormMax: 240 },
  boatSpeed: 10, stormSpeed: 7,          // art pixels per second
  minBoats: 1, maxBoats: 3,              // boats on the water during a tide
  spawnEvery: [20, 32], noSpawnLastSec: 25, arriveSpeed: 12,
  passengers: { row: 2, sail: 4, fish: 6, ferry: 10, storm: 20 },
  // Each tide feels different: its own bay layout, boat mix, weather, and (tide 3) a current and a hidden ferry.
  boatMix: { 1: { row: 0.7, sail: 0.3 }, 2: { row: 0.3, sail: 0.5, fish: 0.2 }, 3: { row: 0.2, sail: 0.3, fish: 0.5 } },
  currentTide: 3, current: { vx: 0, vy: 2.5 },   // art pixels per second; only lit boats drift
  ferryTide: 3,
  litMin: 0.22,                          // light a boat needs to move (same as the kit's "in light")
  dockStaySec: 4,
  fadeSec: 1.5, dawnFadeSec: 6,           // palette dissolve between stages; the storm-to-dawn one is slow
  sunriseSec: 3.5, dawnSummaryAfter: 10, // sunrise easing (about 3x this to finish) and when the summary appears
  // sea stars (design-system/data/economy.json); never taken away
  stars: { perPassengers: 2, steady: 1, flare: 3, storm: 5 },
  badgeStars: { bronze: 5, silver: 10, gold: 20 },
  hiddenBadges: ['whaleWatcher', 'chartMaker', 'archSailor'],   // need things the game doesn't have yet
  seasonalAlways: true,                  // seasonal decorations are always in the shop
};

const $ = id => document.getElementById(id);
const W = 240, H = 135, HZ = Math.round(H * 0.36);
const BX = Math.round(W * 0.15), BY = Math.round(H * 0.62);
const LAMP_Y = { classic: 39, stubby: 28, stone: 35 };
const LAMP = { x: BX, y: BY - LAMP_Y[CFG.lighthouse] };
const DOCK = { x: BX + 43, y: BY + 5 };          // matches LK.island's dock end
const DEFAULT_AIM = Math.atan2(H * 0.68 - LAMP.y, W * 0.8 - LAMP.x);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (dt, tau) => 1 - Math.exp(-dt / tau);

// ---------- noise + dithering (same maths as lk-kit.js) ----------
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => (BAYER[y & 3][x & 3] + 0.5) / 16;
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 982451653) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0; h = h ^ (h >>> 16);
  return ((h >>> 0) % 10000) / 10000;
}
function vnoise(x, y, sc, s) {
  const fx = x / sc, fy = y / sc, ix = Math.floor(fx), iy = Math.floor(fy);
  let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
}
const fbm = (x, y, s) => vnoise(x * 0.6, y, 22, s) * 0.65 + vnoise(x, y, 9, s + 5) * 0.35;

// Fog noise is fixed for the night, so bake it once.
function bakeNoise(seed) {
  const N = { n: new Float32Array(W * H), nb: new Float32Array(W * H), n2: new Float32Array(W * H),
    depth: new Float32Array(W * H), star: new Float32Array(W * H) };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    N.n[i] = fbm(x, y, seed);
    N.nb[i] = vnoise(x * 0.3, y, 5, seed + 1) * 0.6 + vnoise(x * 0.15, y, 12, seed + 2) * 0.4;
    N.n2[i] = vnoise(x, y * 1.6, 7, seed + 3) * 0.5 + N.n[i] * 0.5;
    N.depth[i] = y < HZ ? 0.12 : 0.12 * (1 - (y - HZ) / (H - HZ));
    N.star[i] = hash(x, y, 3);
  }
  return N;
}

// ---------- storage (family's own past nights) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('lk.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lk.' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- the family's progress: sea stars, bag, decorations, logbook counters, rescue album ----------
const DEC = Object.fromEntries(LK.DATA.decorations.map(d => [d.id, d]));
const SLOT = Object.fromEntries(LK.DATA.slots.map(s => [s.id, s]));
const COUNTERS = { passengersHome: 0, boatsHome: 0, steadyBeams: 0, flares: 0, stormShipsHome: 0, nightsPlayed: 0, routesCompleted: 0, rocksRevealed: 0, ruinsLit: 0 };
const PROG = (() => {
  let bag = store.get('bag', null), placed = store.get('placed', null);
  if (!bag) {   // first run, or a save from the old six-item shop: keep what was on the lighthouse
    const OLD = { flag: ['flag', 'topper'], bunting: ['bunting', 'gallery'], pot: ['pot', 'gardenL'], lantern: ['doorLantern', 'door'], crab: ['crab', 'pet'], gull: ['gulls', 'sky'] };
    bag = LK.DATA.decorations.filter(d => d.owned).map(d => d.id); placed = { tower: 'paintClassic' };
    store.get('owned', []).forEach(k => { const m = OLD[k]; if (m) { bag.push(m[0]); placed[m[1]] = m[0]; } });
    try { localStorage.removeItem('lk.owned'); } catch (e) {}
  }
  bag = bag.filter(id => DEC[id]);
  for (const s in placed) if (!DEC[placed[s]] || !bag.includes(placed[s])) delete placed[s];
  placed.tower ??= 'paintClassic';
  return { bag, placed, stars: store.get('stars', 0), counters: { ...COUNTERS, ...store.get('counters', {}) },
    placedEver: store.get('placedEver', Object.values(placed).filter(id => id !== 'paintClassic')), badges: store.get('badges', []), met: store.get('met', []) };
})();
function saveProg() {
  store.set('bag', PROG.bag); store.set('placed', PROG.placed); store.set('stars', PROG.stars); store.set('counters', PROG.counters);
  store.set('placedEver', PROG.placedEver); store.set('badges', PROG.badges); store.set('met', PROG.met);
}
saveProg();

// Keeper's Logbook: badges from design-system/data/badges.json, plus one for lighting the old keeper's ruins
const BADGES = LK.DATA.badges.filter(b => !CFG.hiddenBadges.includes(b.id)).concat([
  { id: 'oldLight', name: 'Old Light', group: 'Explorer', icon: 'ruin', goal: 1, tier: 'silver', text: "Light the old keeper's ruins with a steady beam." }]);
const BADGE_HAVE = {
  firstLight: c => c.steadyBeams, steadyHand: c => c.steadyBeams, lighthouseHeart: c => c.steadyBeams, flareMaker: c => c.flares,
  firstRescue: c => c.boatsHome, harbourFull: c => c.passengersHome, thousand: c => c.passengersHome, stormChaser: c => c.stormShipsHome,
  rockSpotter: c => c.rocksRevealed, oldLight: c => c.ruinsLit,
  teamNight: c => c.nightsPlayed, tenNights: c => c.nightsPlayed, pilotPro: c => c.routesCompleted,
  decorator: () => PROG.placedEver.length,
  collector: () => PROG.bag.filter(id => DEC[id].price > 0).length,
  friends: () => PROG.bag.filter(id => DEC[id].category === 'friends').length,
};

// ---------- link to the Pilot page (relayed through bridge.py) ----------
const RELAY = location.protocol.startsWith('http');
let lastPost = 0;
function pilotState() {
  const r = S.reading || {}, b = selected(), ferry = S.boats.find(o => o.type === 'ferry');
  return {
    stage: S.stage, tide: S.tide, tides: CFG.tides, stageT: S.stageT, durations: CFG.durations, paused: S.paused,
    boatsHome: S.boatsHome, passengers: S.passengers, onWater: activeBoats().length,
    steady: S.beam.count, steadyForFlare: CFG.steadyForFlare, flare: S.beam.flare > 0.5,
    attention: r.att ?? null, poor: r.poor ?? null, headset: headsetLive(), bridgeOn: IN.bridge, simFrost: IN.simFrost,
    threshold: CFG.threshold, holdSec: CFG.holdSec, pending: S.pending, highContrast: S.highContrast,
    tideStats: S.tideStats, summaryShown: S.summaryShown, layout: S.layout, current: currentOn(),
    screen: UI.stack[UI.stack.length - 1] || null, seaStars: PROG.stars,
    ferry: !ferry ? (S.tide >= CFG.ferryTide ? 'home' : 'none') : ferry.state === 'hidden' ? 'hidden' : ferry.state === 'docked' ? 'home' : 'found',

}
function publish(force) {

  lastPost = now;
  fetch('/pilot/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pilotState()) }).catch(() => {});
}
function onPilotCmd(c) {

  else if (c.cmd === 'pause') { if (['calm', 'tide', 'storm'].includes(S.stage)) S.paused = !S.paused; }
  else if (c.cmd === 'frost') IN.simFrost = !IN.simFrost;

    }

}

// ---------- Dawn: team summary, sea stars, new badges and album friends ----------
function showDawn() {

  c.passengersHome += n; c.boatsHome += S.boatsHome; c.steadyBeams += nt.steady; c.flares += nt.flares;
  c.stormShipsHome += nt.storm; c.nightsPlayed++; c.routesCompleted += nt.routes; c.rocksRevealed += nt.rocks; if (nt.ruins) c.ruinsLit++;
  const earned = Math.floor(n / CFG.stars.perPassengers) + nt.steady * CFG.stars.steady + nt.flares * CFG.stars.flare + nt.storm * CFG.stars.storm;
  PROG.stars += earned;

    n > last ? `<p class="up"><span aria-hidden="true">▲</span> ${n - last} more than last night</p>` :
    n === last ? `<p class="same">Just like last night.</p>` : `<p class="same">Every boat came home safely.</p>`;
  const badgeLines = got.map(b => `<p class="news">New badge: ${escapeHTML(b.name)}! +${CFG.badgeStars[b.tier]} sea stars</p>`).join('');
  const friends = nt.newFriends.length ? `<p class="news">New in your rescue album: ${nt.newFriends.map(escapeHTML).join(', ')}</p>` : '';
  const d = $('dawn');
  d.innerHTML = `
    <h1 class="game-title">Dawn!</h1>
    <p class="big">Together you brought ${n} passenger${n === 1 ? '' : 's'} home.</p>
    ${cmp}

    ${badgeLines}${friends}
    <div class="dawnBtns">
      <button class="lk-btn" data-open="shop"><span data-icon="shop"></span>Shop</button>
      <button class="lk-btn" data-open="decorate"><span data-icon="decorate"></span>Decorate</button>

  d.classList.remove('hidden');
  starIcons(d, 4); menuIcons(d, 3);
  $('goodnight').onclick = () => { d.classList.add('hidden'); blurButtons(); setStage('end'); };
  publish(true);

      card.appendChild(info); grid.appendChild(card);
    });
  });
}

// Rescue Album: a sticker for every passenger brought home
function renderAlbum(sheet) {
  sheet.innerHTML = '';
  const met = PEOPLE.filter(x => PROG.met.includes(x.name)).length;
  navRow(sheet, 'album');
  sheetBar(sheet, 'Rescue Album', [el('span', 'sum', `${met} of ${PEOPLE.length} friends met`), btn('lk-btn secondary', 'Close ×', 'close', closeScreen)]);
  const book = el('div', 'book'), pages = [el('div', 'page'), el('div', 'page')];
  book.append(...pages); sheet.appendChild(book);
  ['Fishers', 'Families', 'Sailors'].forEach((g, gi) => {
    const pg = pages[gi < 2 ? 0 : 1];
    pg.appendChild(el('h2', null, g));
    const grid = el('div', 'sgrid'); pg.appendChild(grid);
    PEOPLE.filter(x => x.group === g).forEach(x => {
      const isMet = PROG.met.includes(x.name), card = el('div', 'st ' + (isMet ? 'met' : 'unmet'));
      card.appendChild(LK.spriteCanvas(16, 22, 3, (c, p) => {
        LK.avatar(c, 2, 1, p, x);
        if (!isMet) {   // a silhouette until they come home
          const d = c.getImageData(0, 0, 16, 22), col = LK.parse(p.border);
          for (let i = 0; i < d.data.length; i += 4) if (d.data[i + 3]) { d.data[i] = col[0]; d.data[i + 1] = col[1]; d.data[i + 2] = col[2]; }
          c.putImageData(d, 0, 0);
        }
      }));
      card.appendChild(el('div', null, isMet ? x.name : '???'));
      if (!isMet) card.appendChild(el('small', null, GROUP_HINT[g]));
      grid.appendChild(card);
    });
  });
}

// ---------- keys ----------
const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
addEventListener('keydown', e => {
  const tag = e.target.tagName, inInput = tag === 'INPUT';
  if (UI.stack.length) {   // a child screen is open: keys work its buttons; Esc closes it
    if (e.key === 'Escape') { closeScreen(); e.preventDefault(); }
    else if ((e.key === 'n' || e.key === 'N') && S.stage !== 'end') { closeOverlays(); nextStage(); }
    return;
  }
  if (ARROWS.includes(e.key)) { if (inInput) return; K[e.key] = true; e.preventDefault(); return; }
  if (e.key === ' ') { if (inInput) return; IN.space = true; e.preventDefault(); return; }
  if (e.key === 'Tab' && (S.stage === 'tide' || S.stage === 'storm')) { selectNext(e.shiftKey ? -1 : 1); e.preventDefault(); return; }
  if (e.key === 'Escape' && (S.stage === 'calm' || S.stage === 'tide' || S.stage === 'storm')) { S.paused = !S.paused; publish(true); return; }
  if (e.key === 'Enter' && tag !== 'BUTTON' && ['lighting', 'rest', 'end'].includes(S.stage)) { nextStage(); return; }
  if ((e.key === 'n' || e.key === 'N') && !inInput && S.stage !== 'end') { S.paused = false; nextStage(); return; }
  if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); return; }
  if ((e.key === 'i' || e.key === 'I') && !headsetLive()) { IN.simFrost = !IN.simFrost; publish(true); return; }
});
addEventListener('keyup', e => {
  if (ARROWS.includes(e.key)) K[e.key] = false;
  if (e.key === ' ') { IN.space = false; if (e.target.tagName === 'BUTTON') e.preventDefault(); }
});
addEventListener('blur', () => { ARROWS.forEach(k => K[k] = false); IN.space = false; });

// ---------- layout + loop ----------
function fit() {
  const s = Math.max(1, Math.min(Math.floor(innerWidth / W), Math.floor(innerHeight / H)));
  const cv = $('c');
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  // the HUD is drawn for 4x; it grows with the scene on big screens and never drops below 16px text
  const z = String(Math.max(1, s / 4));
  document.querySelectorAll('.hud, .dawn, .pause, .sheet, .toast').forEach(el => { el.style.zoom = z; });
}
addEventListener('resize', fit);

let prev = null;
function frame(ts) {
  const now = ts / 1000, dt = prev == null ? 0 : Math.min(0.1, now - prev); prev = now;
  if (!S.paused) { S.T += dt; S.stageT += dt; update(dt); }
  render(now);
  updateHUD(); publish();
  requestAnimationFrame(frame);
}

LK.ready(() => {
  const cv = $('c'); cv.width = W; cv.height = H;
  ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  img = ctx.createImageData(W, H);
  newNight();
  S.reading = reading();
  fit();
  requestAnimationFrame(frame);
});
</script>
