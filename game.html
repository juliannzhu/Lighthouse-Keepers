<!doctype html>
<html lang="en" data-theme="harbour-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse Keepers · one night at the harbour</title>
<link rel="stylesheet" href="lighthouse-keepers-handoff/design-system/tokens.css">
<link rel="stylesheet" href="lighthouse-keepers-handoff/design-system/reference/lk-kit.css">
<script src="lighthouse-keepers-handoff/design-system/reference/lk-kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-read); }
  * { box-sizing: border-box; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-4); padding: var(--space-4); transition: background 1.5s; }
  .hidden { display: none !important; }
  .scene, .dawn, .lk-btn { font-variant-ligatures: none; }

  /* ---------- Keeper's screen: scene + HUD (copied from the design system's Game HUD) ---------- */
  .scene { position: relative; }
  .scene canvas { display: block; }
  .hud { position: absolute; font-family: var(--font-pixel); }
  .hud.lk-panel { padding: var(--space-2) var(--space-4); }
  .tl { top: var(--space-4); left: var(--space-4); }
  .tr { top: var(--space-4); right: var(--space-4); text-align: center; }
  .bl { bottom: var(--space-4); left: var(--space-4); display: flex; align-items: center; gap: var(--space-2); }
  .br { bottom: var(--space-4); right: var(--space-4); display: flex; align-items: flex-end; gap: var(--space-2); max-width: 380px; }
  .tide { font-size: 28px; line-height: 32px; font-weight: 600; }
  .ticks { display: flex; gap: var(--space-1); margin-top: var(--space-1); }
  .ticks i { width: 24px; height: 8px; background: var(--border); position: relative; overflow: hidden; }
  .ticks i.on { background: var(--success); }
  .ticks i b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--success); }
  .pips { display: flex; gap: var(--space-2); justify-content: center; margin-top: var(--space-1); }
  .pip { width: 16px; height: 16px; transform: rotate(45deg); box-shadow: 0 0 0 4px var(--outline); background: var(--surface); margin: 6px; transition: background 1s; }
  .pip.on { background: var(--beam); }
  .small { font-size: 16px; line-height: 22px; }
  .bubble { font-size: 20px; line-height: 26px; }
  .bubble .frost { display: flex; align-items: center; gap: var(--space-2); }

  /* Parent card (lamp lighting + rests): parent style, not pixel art */
  .card { position: absolute; top: var(--space-4); right: var(--space-4); width: min(440px, 48%);
    max-height: calc(100% - 150px); overflow: auto; background: var(--surface-raised); color: var(--ink);
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4); }
  .card h2 { margin: 0 0 var(--space-2); }
  .card ol, .card ul { margin: var(--space-2) 0; padding-left: var(--space-6); }
  .cap { color: var(--ink-muted); }
  label.set { display: block; margin: var(--space-4) 0 var(--space-1); font-weight: 700; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .ends { display: flex; justify-content: space-between; }
  .seg { display: flex; gap: var(--space-1); }
  .seg button { flex: 1; font: inherit; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
  .sigrow { display: flex; gap: 10px; align-items: center; }
  .sig { display: inline-flex; align-items: flex-end; gap: 3px; height: 20px; }
  .sig i { width: 6px; background: var(--success); }
  .sig i.off { background: var(--border); }
  canvas.graph { width: 100%; height: 110px; display: block; margin: var(--space-2) 0; }
  .legend { display: flex; gap: var(--space-4); }
  .legend i { width: 18px; height: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .go { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); }

  /* Dawn summary: child-facing pixel panel */
  .dawn { position: absolute; top: var(--space-4); right: var(--space-4); width: min(460px, 50%);
    max-height: calc(100% - 32px); overflow: auto; font-family: var(--font-pixel); }
  .dawn h1 { margin: 0 0 var(--space-1); }
  .dawn .big { font-size: 22px; line-height: 28px; margin: 0 0 var(--space-1); }
  .dawn .up { color: var(--success); font-size: 18px; line-height: 24px; display: flex; gap: var(--space-2); margin: 0 0 var(--space-2); }
  .dawn .same { font-size: 18px; line-height: 24px; margin: 0 0 var(--space-2); }
  .btns { margin-top: var(--space-2); }

  .pause { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; font-family: var(--font-pixel); }

  /* ---------- Pilot's controls bar (parent style) ---------- */
  .bar { min-height: 120px; display: grid; grid-template-columns: 1fr auto; gap: var(--space-2) var(--space-4); align-items: center;
    background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); }
  .bar .who { color: var(--ink-muted); font-weight: 700; text-transform: none; }
  .bar .help { margin: 2px 0 0; }
  .bar .keys { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); margin-top: var(--space-1); }
  .bar .right { display: flex; align-items: center; gap: var(--space-2); }
  .bar .lk-btn { font-size: 16px; line-height: 22px; padding: var(--space-1) var(--space-2) calc(var(--space-1) + var(--space-1)); }
  .status { color: var(--ink-muted); }
  kbd { font-family: var(--font-read); font-weight: 700; font-size: 14px; padding: 1px 6px; border: 1px solid var(--border);
    border-bottom-width: 3px; border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: var(--space-1) solid var(--ink); outline-offset: var(--space-2); }
</style>
</head>
<body>

<div class="scene" id="scene">
  <canvas id="c" class="lk-pixel-canvas" aria-label="Pixel-art harbour at night: a lighthouse shines a beam through fog to guide boats home"></canvas>

  <div class="hud tl lk-panel" id="hudTL"><div class="tide" id="stageName">Lamp lighting</div><div class="ticks" id="ticks"><i><b></b></i><i><b></b></i><i><b></b></i></div></div>
  <div class="hud tr lk-panel" id="hudTR"><div class="small">Steady beams</div><div class="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div></div>
  <div class="hud bl lk-panel" id="hudBL"><span id="boatIcon"></span><span class="small" id="homeText">0 home</span></div>
  <div class="hud br" id="hudBR"><span id="guideAvatar"></span><div class="lk-panel bubble" id="bubble" aria-live="polite"></div></div>

  <div class="card hidden" id="card"></div>
  <div class="dawn lk-panel hidden" id="dawn"></div>
  <div class="pause lk-panel hidden" id="pause"><div class="game-heading">Paused</div><div class="small">Press Esc to carry on.</div></div>
</div>

<div class="bar" id="bar">
  <div>
    <div class="who parent-caption">Harbour Pilot</div>
    <div class="help parent-body" id="help"></div>
    <div class="keys parent-caption" id="keys"></div>
  </div>
  <div class="right">
    <span class="status parent-caption" id="src"></span>
    <button class="lk-btn secondary" id="pauseBtn">Pause</button>
    <button class="lk-btn" id="mainBtn">Start the night</button>
  </div>
</div>

<script>
'use strict';
// ---------- Config (open design decisions stay as values) ----------
const CFG = {
  // Palette per stage. The Storm Ship climax uses Deep Fjord.
  stagePalettes: { lighting: 'harbour-night', calm: 'sea-glass', tide: 'sea-glass', rest: 'sea-glass',
                   storm: 'deep-fjord', dawn: 'harbour-night', end: 'harbour-night' },
  lighthouse: 'classic', fog: 'bands',   // fog: bands | dither | clouds
  threshold: 45, holdSec: 3,             // attention 0–100; seconds above threshold for a steady beam
  easeSec: 1, frostAbove: 50, steadyForFlare: 3, flareSec: 10,
  tides: 3,
  durations: { calm: 60, tide: 180, stormMax: 240 },
  boatSpeed: 14, stormSpeed: 9,          // art pixels per second
  maxBoats: 4, spawnEvery: [20, 32], noSpawnLastSec: 25,
  passengers: { row: 2, sail: 4, fish: 6, storm: 20 },
  litMin: 0.22,                          // light a boat needs to move (same as the kit's "in light")
  dockStaySec: 4,
};

const $ = id => document.getElementById(id);
const W = 240, H = 135, HZ = Math.round(H * 0.36);
const BX = Math.round(W * 0.15), BY = Math.round(H * 0.62);
const LAMP_Y = { classic: 39, stubby: 28, stone: 35 };
const LAMP = { x: BX, y: BY - LAMP_Y[CFG.lighthouse] };
const DOCK = { x: BX + 43, y: BY + 5 };          // matches LK.island's dock end
const DEFAULT_AIM = Math.atan2(H * 0.68 - LAMP.y, W * 0.8 - LAMP.x);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (dt, tau) => 1 - Math.exp(-dt / tau);

// ---------- noise + dithering (same maths as lk-kit.js) ----------
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => (BAYER[y & 3][x & 3] + 0.5) / 16;
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 982451653) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0; h = h ^ (h >>> 16);
  return ((h >>> 0) % 10000) / 10000;
}
function vnoise(x, y, sc, s) {
  const fx = x / sc, fy = y / sc, ix = Math.floor(fx), iy = Math.floor(fy);
  let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
}
const fbm = (x, y, s) => vnoise(x * 0.6, y, 22, s) * 0.65 + vnoise(x, y, 9, s + 5) * 0.35;

// Fog noise is fixed for the night, so bake it once.
function bakeNoise(seed) {
  const N = { n: new Float32Array(W * H), nb: new Float32Array(W * H), n2: new Float32Array(W * H),
    depth: new Float32Array(W * H), star: new Float32Array(W * H) };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    N.n[i] = fbm(x, y, seed);
    N.nb[i] = vnoise(x * 0.3, y, 5, seed + 1) * 0.6 + vnoise(x * 0.15, y, 12, seed + 2) * 0.4;
    N.n2[i] = vnoise(x, y * 1.6, 7, seed + 3) * 0.5 + N.n[i] * 0.5;
    N.depth[i] = y < HZ ? 0.12 : 0.12 * (1 - (y - HZ) / (H - HZ));
    N.star[i] = hash(x, y, 3);
  }
  return N;
}

// ---------- storage (family's own past nights) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('lk.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lk.' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- attention input: headset over the bridge, or the Space-bar simulator ----------
const IN = { att: null, poor: null, last: 0, bridge: false, simAtt: 20, space: false, simFrost: false, simSig: 0 };
if (location.protocol.startsWith('http')) {
  const es = new EventSource('/events');
  es.onerror = () => { IN.bridge = false; };
  es.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'bridge') { IN.bridge = msg.status === 'connected'; return; }
    if (msg.type !== 'packet') return;
    const d = msg.data;
    if (d.eSense) { IN.att = d.eSense.attention ?? IN.att; IN.last = performance.now(); }
    if ('poorSignalLevel' in d) { IN.poor = d.poorSignalLevel; IN.last = performance.now(); }
  };
}
const headsetLive = () => !IN.space && performance.now() - IN.last < 3000 && IN.poor != null;
function reading() {
  if (headsetLive()) {
    const ok = IN.poor < 200 && IN.att != null;
    return { att: ok ? IN.att : null, poor: IN.poor, q: IN.poor >= 200 ? 0 : clamp(1 - IN.poor / 200, 0, 1) };
  }
  const poor = IN.simFrost ? 120 : Math.round((1 - IN.simSig) * 120);   // frost clears as the simulated headset settles
  return { att: IN.simAtt, poor, q: 1 - poor / 200 };
}

// ---------- state ----------
let S, P, C, N, ctx;
const K = {};
function newNight() {
  S = {
    stage: 'lighting', tide: 0, T: 0, stageT: 0, paused: false, theme: null,
    boats: [], sel: null, rocks: [], buoys: [], channel: null, passengers: 0, boatsHome: 0,
    beam: { level: 0, aim: DEFAULT_AIM, aboveSince: null, steady: false, count: 0, flareUntil: 0, flare: 0, lowSince: 0, eff: 0 },
    dens: 0.72, hist: [], histT: 0, tideStats: null, pending: { threshold: CFG.threshold, holdSec: CFG.holdSec },
    guide: { text: '', until: 0 }, nextSpawn: 0,
    channelOnce: false, summaryShown: false, snap: null, transT0: 0,
  };
  N = bakeNoise(1 + Math.floor(Math.random() * 900));
  makeNightRocks();
  $('dawn').classList.add('hidden');
  setStage('lighting');
}

// ---------- palette ----------
const palCache = {};
function palette(theme) {
  if (!palCache[theme]) {
    const p = LK.pal(theme), rgb = {};
    LK.KEYS.forEach(k => { rgb[k] = LK.parse(p[k]); });
    palCache[theme] = { p, rgb };
  }
  return palCache[theme];
}
const themeFor = stage => CFG.stagePalettes[stage];
function applyTheme(theme) {
  if (theme === S.theme) return;
  if (S.theme && ctx) { S.snap = ctx.getImageData(0, 0, W, H); S.transT0 = performance.now(); }
  S.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  ({ p: P, rgb: C } = palette(theme));
  drawIcons();
}

// ---------- rocks, boats, channel ----------
const distTo = (a, b, x, y) => Math.hypot(a - x, b - y);
function makeNightRocks() {
  for (let tries = 0; S.rocks.length < 7 && tries < 400; tries++) {
    const x = Math.round(rand(85, 215)), y = Math.round(rand(HZ + 12, 126));
    if (S.rocks.some(r => distTo(r.x, r.y, x, y) < 20) || distTo(DOCK.x, DOCK.y, x, y) < 26) continue;
    S.rocks.push({ x, y, revealed: false, splashUntil: 0 });
  }
}
// rock (x,y) is its 8×4 sprite's centre
function rockHits(r, cx, cy, hw, hh) { return Math.abs(cx - r.x) < 4 + hw - 2 && Math.abs(cy + hh * 0.3 - r.y) < 5; }

function makeBoat(type, x, y) {
  const sz = LK.spriteSize(LK.SPRITES[type]);
  return { type, x, y, w: sz.w, h: sz.h, passengers: CFG.passengers[type], state: 'sea', left: true,
    trail: [], pauseUntil: 0, status: 'ready', dockT: 0, slotX: 0, slotY: 0 };
}
function spawnBoat() {
  for (let tries = 0; tries < 60; tries++) {
    const x = Math.round(rand(140, 222)), y = Math.round(rand(HZ + 12, 124));
    if (S.boats.some(b => b.state === 'sea' && distTo(b.x, b.y, x, y) < 18)) continue;
    if (S.rocks.some(r => distTo(r.x, r.y, x, y) < 14)) continue;
    const type = x > 195 ? (Math.random() < 0.5 ? 'fish' : 'sail') : x > 165 ? (Math.random() < 0.5 ? 'sail' : 'row') : 'row';
    const b = makeBoat(type, x, y);
    S.boats.push(b);
    if (!selected()) S.sel = b;
    return;
  }
}
const seaBoats = () => S.boats.filter(b => b.state === 'sea');
const selected = () => (S.sel && S.sel.state === 'sea') ? S.sel : null;
function selectNext(dir = 1) {
  const list = seaBoats();
  if (!list.length) { S.sel = null; return; }
  const i = list.indexOf(S.sel);
  S.sel = list[(i + dir + list.length) % list.length];
}
function autoSelect() {
  if (selected()) return;
  const list = seaBoats();
  S.sel = list.find(b => b.type === 'storm') || list[0] || null;
}

function onLand(x, y, hw) {
  if (y < HZ + 4) return true;
  const r = y - BY;
  if (r >= -2 && r <= 10 && Math.abs(x - BX) < 15 + 1.4 * Math.max(0, r) + 2 + hw * 0.5) return true;
  if (y < BY && Math.abs(x - BX) < 8 + hw * 0.5) return true;
  return false;
}
function inDock(b) {
  const big = b.type === 'storm';
  return b.x > DOCK.x - (big ? 30 : 24) && b.x < DOCK.x + (big ? 20 : 8) && b.y > DOCK.y - (big ? 8 : 6) && b.y < DOCK.y + (big ? 16 : 12);
}

function distToSeg(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], t = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / (dx * dx + dy * dy), 0, 1);
  return Math.hypot(px - a[0] - dx * t, py - a[1] - dy * t);
}
const distToPath = (pts, x, y) => Math.min(...pts.slice(1).map((p, i) => distToSeg(x, y, pts[i], p)));

function startStorm() {
  const ship = makeBoat('storm', 204, 66);
  S.boats.push(ship); S.sel = ship;
  const pts = [[196, 70], [170, 86], [140, 96], [112, 92], [90, 102], [DOCK.x + 2, DOCK.y + 8]];
  S.channel = pts;
  // buoy pairs either side of the channel, every ~16 px
  S.buoys = [];
  for (let s = 0; s < pts.length - 1; s++) {
    const [ax, ay] = pts[s], [bx, by] = pts[s + 1], len = Math.hypot(bx - ax, by - ay), nx = -(by - ay) / len, ny = (bx - ax) / len;
    for (let u = s === 0 ? 8 : 0; u < len; u += 16) {
      const x = ax + (bx - ax) * u / len, y = ay + (by - ay) * u / len;
      [-9, 9].forEach(o => {
        const X = Math.round(x + nx * o), Y = Math.round(y + ny * o);
        if (!onLand(X, Y, 0)) S.buoys.push({ x: X, y: Y, revealed: false });
      });
    }
  }
  // the storm pushes rocks off the channel and scatters more around it
  S.rocks = S.rocks.filter(r => distToPath(pts, r.x, r.y) > 13);
  for (let tries = 0, added = 0; added < 14 && tries < 600; tries++) {
    const x = Math.round(rand(88, 228)), y = Math.round(rand(HZ + 8, 128));
    if (distToPath(pts, x, y) < 14 || distTo(204, 66, x, y) < 22 || distTo(DOCK.x, DOCK.y, x, y) < 22) continue;
    if (S.rocks.some(r => distTo(r.x, r.y, x, y) < 12)) continue;
    S.rocks.push({ x, y, revealed: false, splashUntil: 0 }); added++;
  }
}

// ---------- stages ----------
const STAGE_NAME = { lighting: 'Lamp lighting', calm: 'Calm waters', rest: 'Rest', storm: 'Storm ship', dawn: 'Dawn', end: 'Dawn' };
function say(text, secs) { S.guide.text = text; S.guide.until = S.T + (secs || 5); }

function setStage(stage) {
  S.stage = stage; S.stageT = 0;
  applyTheme(themeFor(stage));
  showCard(stage === 'lighting' || stage === 'rest' ? stage : null);
  S.guide.until = 0; S.beam.lowSince = S.T;
  if (stage === 'calm') {
    CFG.threshold = S.pending.threshold; CFG.holdSec = S.pending.holdSec;
    say('Look at the lighthouse. Sit tall and watch the beam grow.', 8);
  }
  if (stage === 'tide') {
    S.tide++;
    CFG.threshold = S.pending.threshold; CFG.holdSec = S.pending.holdSec;
    S.beam.count = 0; S.hist = []; S.tideStats = { above: 0, total: 0, steady: 0, boats: 0 };
    spawnBoat(); spawnBoat(); autoSelect();
    S.nextSpawn = S.T + rand(...CFG.spawnEvery);
    say(S.tide === 1 ? 'Boats are coming! Keep the light steady to guide them home.' : `Tide ${S.tide}. More boats are on their way.`, 7);
  }
  if (stage === 'rest') say('Rest time. Stretch your arms and take a slow breath.', 1e9);
  if (stage === 'storm') { startStorm(); say('A big ship is in the storm. Hold the light steady to find its channel.', 8); }
  if (stage === 'dawn') {
    S.boats.forEach(b => { if (b.state === 'sea') b.state = 'towing'; });
    say('The sun is coming up. The last boats are being towed home.', 8);
  }
  if (stage === 'end') say('Goodnight, keepers. See you tomorrow night.', 1e9);
  updateBar();
}

function nextStage() {
  switch (S.stage) {
    case 'lighting': return setStage('calm');
    case 'calm': return setStage('tide');
    case 'tide': return setStage(S.tide < CFG.tides ? 'rest' : 'storm');
    case 'rest': return setStage('tide');
    case 'storm': return setStage('dawn');
    case 'dawn':
      if (S.summaryShown) { $('dawn').classList.add('hidden'); return setStage('end'); }
      S.boats.forEach(b => { if (b.state === 'towing') { b.x = b.slotX || DOCK.x - 6; b.y = DOCK.y + 4; dockBoat(b, true); } });
      return showDawn();
    case 'end': return newNight();
  }
}

// ---------- beam (same rules as harbour.html) ----------
function beamTarget(r) {
  if (r.att == null) return 0;
  const a = r.att / 100, th = CFG.threshold / 100;
  return a < th ? 0.08 * a / th : 0.12 + 0.88 * Math.min(1, (a - th) / Math.max(0.01, 1 - th));
}
function updateBeam(r, dt) {
  const B = S.beam, T = S.T;
  B.level += (beamTarget(r) - B.level) * ease(dt, CFG.easeSec / 3);
  const counting = S.stage === 'calm' || S.stage === 'tide' || S.stage === 'storm';
  const flaring = T < B.flareUntil;
  const above = r.att != null && r.att >= CFG.threshold;
  if (!above || !counting) { B.aboveSince = null; B.steady = false; }
  else {
    B.aboveSince ??= T;
    if (!B.steady && T - B.aboveSince >= CFG.holdSec) {

// ---------- main update ----------
function update(dt) {

  IN.simAtt += (target - IN.simAtt) * ease(dt, 1.2);
  IN.simSig = Math.min(1, IN.simSig + dt / 5);        // simulated headset settles over ~5 s
  const r = reading();
  S.reading = r;
  updateBeam(r, dt);
  lit = makeLit();

  if (S.stage === 'tide') {

// ---------- rendering ----------
let cr = 0, cg = 0, cb = 0;
const set = c => { cr = c[0]; cg = c[1]; cb = c[2]; };
const mixT = (c, t) => { cr += (c[0] - cr) * t; cg += (c[1] - cg) * t; cb += (c[2] - cb) * t; };

let img = null;

function look() {
  const st = S.stage, phase = st === 'rest' ? 'tide' : st === 'end' ? 'dawn' : st;
  return { phase, dawn: phase === 'dawn', storm: phase === 'storm',
    dens: 0.72 * ({ lighting: 1, calm: 0.55, tide: 1, storm: 1.3, dawn: 0.22 }[phase] || 1),
    starTh: phase === 'calm' || phase === 'dawn' ? 0.982 : 0.99 };
}

function renderBackground(now) {
  const L0 = look(), fl = S.beam.flare, fm = 1 - 0.65 * fl, steady = S.beam.steady && fl < 0.5;

  const seaTop = L0.dawn ? mixRGB(C.sea, C.lamp, 0.18) : C.sea, sunX = W * 0.72, sunR = 10;

      if (!L0.storm && N.star[i] > L0.starTh && y < HZ - 5) set(C.star);
      if (L0.dawn) { const sd = Math.hypot(x - sunX, (y - HZ) * 1.1); if (sd < sunR) set(sd < sunR - 2 ? C.beam : C['beam-core']); }
    } else {

    lighting: 'Lamp lighting: put the headset on the Keeper. The frost on the lamp clears as the signal settles. Start the night when the lamp is clear.',
    calm: 'Calm waters: no boats yet. Let the Keeper see the beam respond. Try saying "Look how far the beam reaches."',
    tide: 'Steer the marked boat to the dock beside the lighthouse. Boats move only in the light and wait in the dark.',
    rest: 'Rest: change the settings if you like, then start the next tide.',
    storm: 'The storm ship: a steady beam shows the buoys. Steer the big ship between them to the dock. Rocks block the way outside the channel.',
    dawn: 'Dawn: the last boats are towed home. Read the team result together.',
    end: 'The night is over. Start a new night whenever you are ready.',
  };
  $('help').textContent = HELP[st];
  const keys = [];
  if (st === 'lighting') keys.push(`${kb('Enter')} start the night`);
  if (st === 'rest') keys.push(`${kb('Enter')} start tide ${S.tide + 1}`);
  if (st === 'tide' || st === 'storm') keys.push(`${kb('←')} ${kb('↑')} ${kb('→')} ${kb('↓')} steer`, `${kb('Tab')} next boat`);
  if (st === 'calm' || st === 'tide' || st === 'storm') keys.push(`${kb('Esc')} pause`);
  if (st !== 'end') keys.push(`${kb('N')} skip to the next stage`);
  if (!headsetLive()) keys.push(`${kb('Space')} hold for simulated attention`, `${kb('F')} test frosty lamp`);
  keys.push('<span id="timeLeft"></span>', '<span id="boatStatus"></span>');
  setHTML($('keys'), keys.map(k => `<span>${k}</span>`).join(''));
  const main = $('mainBtn'), pause = $('pauseBtn');
  main.textContent = { lighting: 'Start the night', rest: `Start tide ${S.tide + 1}`, end: 'Start a new night' }[st] || (st === 'dawn' ? 'Show the summary' : 'Skip stage');
  main.classList.toggle('hidden', st === 'dawn' && S.summaryShown);
  pause.classList.toggle('hidden', !(st === 'calm' || st === 'tide' || st === 'storm'));
  pause.textContent = S.paused ? 'Carry on' : 'Pause';
}
let lastLive = null;
function updateBarLive() {
  const live = headsetLive();
  if (live !== lastLive) { lastLive = live; updateBar(); }
  setText($('src'), live ? 'Headset connected' : IN.space ? 'Simulated attention (Space held)' : IN.bridge ? 'Bridge on, no headset data: simulator' : 'Simulator (no headset)');
  const st = S.stage, tl = $('timeLeft'), bs = $('boatStatus');
  if (tl) setText(tl, st === 'calm' ? `Tide 1 starts in ${mmss(CFG.durations.calm - S.stageT)}` :
    st === 'tide' ? `Tide ${S.tide}: ${mmss(Math.max(0, CFG.durations.tide - S.stageT))} left` : '');
  const b = selected();
  if (bs) setText(bs, !b || !(st === 'tide' || st === 'storm') ? (st === 'tide' && !b ? 'Waiting for the next boat…' : '') :
    b.status === 'dark' ? 'Marked boat: waiting for light' :
    b.status === 'bumped' ? 'Bump! A hidden rock. A steady beam shows the rocks.' :
    b.status === 'moving' ? 'Marked boat: sailing' : 'Marked boat: ready');
}

// ---------- parent card (lamp lighting + rests) ----------
function sigInfo() {
  if (!headsetLive()) return [4, IN.simFrost ? 'simulator: frosty' : 'simulator'];
  const p = IN.poor;
  return p == null ? [0, 'no data'] : p === 0 ? [4, 'good'] : p <= CFG.frostAbove ? [3, 'fair'] : p < 200 ? [2, 'noisy'] : [0, 'not touching skin'];
}
function showCard(kind) {
  const c = $('card');
  if (!kind) { c.classList.add('hidden'); return; }
  c.classList.remove('hidden');
  const st = S.tideStats, pct = st && st.total ? Math.round(st.above / st.total * 100) : 0;
  const hint = !st ? '' : pct > 70 ? 'The Keeper found this tide easy. You could raise the threshold a little.' :
    pct < 25 ? 'This tide was hard work. Lowering the threshold a little could help.' : 'This threshold looks about right.';
  c.innerHTML = `
    <h2 class="parent-heading">${kind === 'lighting' ? 'Before the night' : `Rest after tide ${S.tide}`}</h2>
    ${kind === 'lighting' ? `
      <ol class="parent-body">
        <li>Turn the headset on and help the Keeper sit comfortably.</li>
        <li>Put the sensor flat on the forehead and the clip on the ear lobe.</li>
        <li>Wait for the frost on the lamp to clear.</li>
      </ol>
      <p class="parent-caption cap">Keep your talk short and positive. Try "Nice steady light!"</p>` : `
      <div class="parent-caption cap">Keeper's attention during tide ${S.tide}. Only you see this.</div>
      <canvas class="graph" id="graph" aria-label="Line graph of attention during the last tide against the threshold line"></canvas>
      <div class="legend parent-caption"><span><i style="background:var(--accent)"></i>Attention</span><span><i style="background:var(--ink-muted)"></i>Threshold</span></div>
      <p class="parent-body">Boats home so far: ${S.boatsHome}. Steady beams this tide: ${st.steady}. Above the threshold ${pct}% of the tide. ${hint}</p>
      <div class="parent-body">Encouraging things to say:<ul><li>"Nice steady light!"</li><li>"Look how far the beam reaches."</li><li>"Let's take a slow breath together."</li></ul></div>`}
    <label class="set parent-body">Headset signal</label>
    <div class="sigrow"><span class="sig" id="sigBars"><i style="height:6px"></i><i style="height:10px"></i><i style="height:14px"></i><i style="height:20px"></i></span><span class="parent-body" id="sigText"></span></div>
    <label class="set parent-body" for="th">Light threshold: <span id="thVal"></span></label>
    <input id="th" type="range" min="10" max="90" step="1">
    <div class="ends parent-caption cap"><span>Easier</span><span>Harder</span></div>
    <label class="set parent-body">Hold time for a steady beam</label>
    <div class="seg" id="hold"><button data-s="2">2 s</button><button data-s="3">3 s</button><button data-s="4">4 s</button></div>
    <p class="parent-caption cap">Changes apply when the next ${kind === 'lighting' ? 'stage' : 'tide'} starts, so the Keeper isn't interrupted.</p>
    <div class="go"><button class="lk-btn" id="cardGo">${kind === 'lighting' ? 'Start the night' : `Start tide ${S.tide + 1}`}</button><span class="parent-caption cap">or press ${kb('Enter')}</span></div>`;
  $('th').value = S.pending.threshold; $('thVal').textContent = S.pending.threshold;
  $('th').oninput = e => { S.pending.threshold = +e.target.value; $('thVal').textContent = S.pending.threshold; drawGraph(); };
  const hb = [...$('hold').children], mark = () => hb.forEach(b => b.classList.toggle('on', +b.dataset.s === S.pending.holdSec));
  hb.forEach(b => b.onclick = () => { S.pending.holdSec = +b.dataset.s; mark(); }); mark();
  $('cardGo').onclick = () => nextStage();
  drawGraph();
}
function updateCardLive() {
  if ($('card').classList.contains('hidden') || !$('sigBars')) return;
  const [bars, word] = sigInfo();
  [...$('sigBars').children].forEach((el, i) => el.classList.toggle('off', i >= bars));
  setText($('sigText'), word[0].toUpperCase() + word.slice(1));
}
function drawGraph() {
  const cv = $('graph');
  if (!cv) return;
  const r = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * r; cv.height = h * r;
  const g = cv.getContext('2d'), p = P;
  g.scale(r, r);
  g.strokeStyle = p.border; g.lineWidth = 1;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, h * i / 4 + .5); g.lineTo(w, h * i / 4 + .5); g.stroke(); }
  const ty = h * (1 - S.pending.threshold / 100);
  g.strokeStyle = p['ink-muted']; g.setLineDash([6, 5]); g.lineWidth = 2; g.beginPath(); g.moveTo(0, ty); g.lineTo(w, ty); g.stroke(); g.setLineDash([]);
  g.strokeStyle = p.accent; g.lineWidth = 2.5; g.beginPath();
  let started = false;
  const span = Math.max(30, ...S.hist.map(pt => pt.t));   // a skipped tide still fills the graph
  for (const pt of S.hist) {
    if (pt.a == null) { started = false; continue; }
    const x = pt.t / span * w, y = h * (1 - pt.a / 100);
    started ? g.lineTo(x, y) : g.moveTo(x, y); started = true;
  }
  g.stroke();
}

// ---------- Dawn: team summary ----------
function showDawn() {
  if (S.summaryShown) return;
  S.summaryShown = true;
  const n = S.passengers, last = store.get('lastNight', null);
  store.set('lastNight', n);
  const cmp = last == null ? `<p class="same">Your first night at the harbour.</p>` :
    n > last ? `<p class="up"><span aria-hidden="true">▲</span> ${n - last} more than last night</p>` :
    n === last ? `<p class="same">Just like last night.</p>` : `<p class="same">Every boat came home safely.</p>`;
  const d = $('dawn');
  d.innerHTML = `
    <h1 class="game-title">Dawn!</h1>
    <p class="big">Together you brought ${n} passenger${n === 1 ? '' : 's'} home.</p>
    ${cmp}
    <div class="btns"><button class="lk-btn" id="goodnight">Goodnight</button></div>`;
  d.classList.remove('hidden');
  $('goodnight').onclick = () => { d.classList.add('hidden'); setStage('end'); };
  updateBar();
  $('goodnight').focus({ preventScroll: true });
}

// ---------- keys ----------
const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
addEventListener('keydown', e => {
  const tag = e.target.tagName, inInput = tag === 'INPUT';
  if (ARROWS.includes(e.key)) { if (inInput) return; K[e.key] = true; e.preventDefault(); return; }
  if (e.key === ' ') { if (inInput) return; IN.space = true; e.preventDefault(); return; }
  if (e.key === 'Tab' && (S.stage === 'tide' || S.stage === 'storm')) { selectNext(e.shiftKey ? -1 : 1); e.preventDefault(); return; }
  if (e.key === 'Escape' && (S.stage === 'calm' || S.stage === 'tide' || S.stage === 'storm')) { S.paused = !S.paused; updateBar(); return; }
  if (e.key === 'Enter' && tag !== 'BUTTON' && (S.stage === 'lighting' || S.stage === 'rest')) { nextStage(); return; }
  if ((e.key === 'n' || e.key === 'N') && !inInput && S.stage !== 'end') { S.paused = false; nextStage(); return; }
  if ((e.key === 'f' || e.key === 'F') && !headsetLive()) { IN.simFrost = !IN.simFrost; return; }
});
addEventListener('keyup', e => {
  if (ARROWS.includes(e.key)) K[e.key] = false;
  if (e.key === ' ') { IN.space = false; if (e.target.tagName === 'BUTTON') e.preventDefault(); }
});
addEventListener('blur', () => { ARROWS.forEach(k => K[k] = false); IN.space = false; });
$('mainBtn').onclick = () => { S.paused = false; nextStage(); };
$('pauseBtn').onclick = () => { S.paused = !S.paused; updateBar(); };

// ---------- layout + loop ----------
function fit() {
  const s = Math.max(1, Math.min(Math.floor((innerWidth - 32) / W), Math.floor((innerHeight - $('bar').offsetHeight - 48) / H)));
  const cv = $('c');
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  $('bar').style.width = W * s + 'px';
}
addEventListener('resize', fit);

let prev = null;
function frame(ts) {
  const now = ts / 1000, dt = prev == null ? 0 : Math.min(0.1, now - prev); prev = now;
  if (!S.paused) { S.T += dt; S.stageT += dt; update(dt); }
  render(now);
  updateHUD(); updateBarLive(); updateCardLive();
  requestAnimationFrame(frame);
}

LK.ready(() => {
  const cv = $('c'); cv.width = W; cv.height = H;
  ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  img = ctx.createImageData(W, H);
  newNight();
  S.reading = reading();
  fit();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
