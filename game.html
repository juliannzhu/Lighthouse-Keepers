<!doctype html>
<html lang="en" data-theme="harbour-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse Keepers · one night at the harbour</title>
<link rel="stylesheet" href="lighthouse-keepers-handoff/design-system/tokens.css">
<link rel="stylesheet" href="lighthouse-keepers-handoff/design-system/reference/lk-kit.css">
<script src="lighthouse-keepers-handoff/design-system/reference/lk-kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-read); }
  * { box-sizing: border-box; }
  /* the game fills the screen at a whole-number scale; any leftover edge is a thin dark border */
  body { height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--outline); }
  .hidden { display: none !important; }
  .scene, .dawn, .lk-btn { font-variant-ligatures: none; }

  /* ---------- Keeper's screen: scene + HUD (copied from the design system's Game HUD) ---------- */
  .scene { position: relative; }
  .scene canvas { display: block; }
  .hud { position: absolute; font-family: var(--font-pixel); }
  .hud.lk-panel { padding: var(--space-2) var(--space-4); }
  .tl { top: var(--space-4); left: var(--space-4); }
  .tr { top: var(--space-4); right: var(--space-4); text-align: center; }
  .bl { bottom: var(--space-4); left: var(--space-4); display: flex; align-items: center; gap: var(--space-2); }
  .br { bottom: var(--space-4); right: var(--space-4); display: flex; align-items: flex-end; gap: var(--space-2); max-width: 380px; }
  .tide { font-size: 28px; line-height: 32px; font-weight: 600; }
  .ticks { display: flex; gap: var(--space-1); margin-top: var(--space-1); }
  .ticks i { width: 24px; height: 8px; background: var(--border); position: relative; overflow: hidden; }
  .ticks i.on { background: var(--success); }
  .ticks i b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--success); }
  .pips { display: flex; gap: var(--space-2); justify-content: center; margin-top: var(--space-1); }
  .pip { width: 16px; height: 16px; transform: rotate(45deg); box-shadow: 0 0 0 4px var(--outline); background: var(--surface); margin: 6px; transition: background 1s; }
  .pip.on { background: var(--beam); }
  .small { font-size: 16px; line-height: 22px; }
  .bubble { font-size: 20px; line-height: 26px; }
  .bubble .frost { display: flex; align-items: center; gap: var(--space-2); }

  /* Dawn summary + decorations shop: child-facing pixel panel */
  .dawn { position: absolute; top: var(--space-4); right: var(--space-4); width: min(460px, 50%);
    max-height: calc(100% - 32px); overflow: auto; font-family: var(--font-pixel); }
  .dawn h1 { margin: 0 0 var(--space-1); }
  .dawn .big { font-size: 22px; line-height: 28px; margin: 0 0 var(--space-1); }
  .dawn .up { color: var(--success); font-size: 18px; line-height: 24px; display: flex; gap: var(--space-2); margin: 0 0 var(--space-2); }
  .dawn .same { font-size: 18px; line-height: 24px; margin: 0 0 var(--space-2); }
  .stars { display: flex; gap: var(--space-2); align-items: center; font-size: 20px; line-height: 26px; margin-bottom: var(--space-2); }
  .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-2); }
  .item { text-align: center; padding: var(--space-1); margin: var(--space-1); cursor: pointer; font: inherit; color: var(--ink); border: 0; }
  .item canvas { margin: 0 auto; display: block; }
  .item div { font-size: 16px; line-height: 22px; }
  .item small { font-size: 16px; line-height: 22px; color: var(--ink-muted); display: block; }
  .item.picked { box-shadow: 0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent); }
  .item.cant { cursor: default; opacity: .6; }
  .item:focus-visible { outline: var(--space-1) solid var(--ink); outline-offset: var(--space-2); }
  .btns { margin-top: var(--space-2); }


  .pause { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; font-family: var(--font-pixel); }

  button:focus-visible, input:focus-visible { outline: var(--space-1) solid var(--ink); outline-offset: var(--space-2); }
</style>
</head>
<body>

<div class="scene" id="scene">
  <canvas id="c" class="lk-pixel-canvas" aria-label="Pixel-art harbour at night: a lighthouse shines a beam through fog to guide boats home"></canvas>

  <div class="hud tl lk-panel" id="hudTL"><div class="tide" id="stageName">Lamp lighting</div><div class="ticks" id="ticks"><i><b></b></i><i><b></b></i><i><b></b></i></div></div>
  <div class="hud tr lk-panel" id="hudTR"><div class="small">Steady beams</div><div class="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div></div>
  <div class="hud bl lk-panel" id="hudBL"><span id="boatIcon"></span><span class="small" id="homeText">0 home</span></div>
  <div class="hud br" id="hudBR"><span id="guideAvatar"></span><div class="lk-panel bubble" id="bubble" aria-live="polite"></div></div>

  <div class="hud tr lk-panel small hidden" id="hudHint" style="max-width:360px"></div>
  <div class="dawn lk-panel hidden" id="dawn"></div>
  <div class="pause lk-panel hidden" id="pause"><div class="game-heading">Paused</div><div class="small">Press Esc to carry on.</div></div>
</div>

<script>
'use strict';
// ---------- Config (open design decisions stay as values) ----------
const CFG = {
  // Palette per stage. The Storm Ship climax uses Deep Fjord.
  stagePalettes: { lighting: 'harbour-night', calm: 'sea-glass', tide: 'sea-glass', rest: 'sea-glass',
                   storm: 'deep-fjord', dawn: 'harbour-night', end: 'harbour-night' },
  highContrastTheme: 'storm-ink',        // accessibility switch overrides every stage
  lighthouse: 'classic', fog: 'bands',   // fog: bands | dither | clouds
  threshold: 45, holdSec: 3,             // attention 0–100; seconds above threshold for a steady beam
  easeSec: 1, frostAbove: 50, steadyForFlare: 3, flareSec: 10,
  tides: 3,
  durations: { calm: 60, tide: 180, stormMax: 240 },
  boatSpeed: 10, stormSpeed: 7,          // art pixels per second
  minBoats: 1, maxBoats: 3,              // boats on the water during a tide
  spawnEvery: [20, 32], noSpawnLastSec: 25, arriveSpeed: 12,
  passengers: { row: 2, sail: 4, fish: 6, ferry: 10, storm: 20 },
  // Each tide feels different: its own bay layout, boat mix, and (tide 3) a current and a hidden ferry.
  boatMix: { 1: { row: 0.7, sail: 0.3 }, 2: { row: 0.3, sail: 0.5, fish: 0.2 }, 3: { row: 0.2, sail: 0.3, fish: 0.5 } },
  currentTide: 3, current: { vx: 0, vy: 2.5 },   // art pixels per second; only lit boats drift
  ferryTide: 3,
  litMin: 0.22,                          // light a boat needs to move (same as the kit's "in light")
  dockStaySec: 4,
  fadeSec: 1.5, dawnFadeSec: 6,           // palette dissolve between stages; the storm-to-dawn one is slow
  sunriseSec: 3.5, dawnSummaryAfter: 10, // sunrise easing (about 3x this to finish) and when the summary appears
};
const SHOP = [['flag', 'Flag', 3], ['pot', 'Flowers', 4], ['bunting', 'Bunting', 5], ['lantern', 'Lantern', 6], ['crab', 'Crab friend', 4], ['gull', 'Gull', 2]];
const DECO_AT = { flag: [0, -50], bunting: [-8, -37], pot: [-15, -7], lantern: [7, -6], crab: [14, -4], gull: [20, -42] };

const $ = id => document.getElementById(id);
const W = 240, H = 135, HZ = Math.round(H * 0.36);
const BX = Math.round(W * 0.15), BY = Math.round(H * 0.62);
const LAMP_Y = { classic: 39, stubby: 28, stone: 35 };
const LAMP = { x: BX, y: BY - LAMP_Y[CFG.lighthouse] };
const DOCK = { x: BX + 43, y: BY + 5 };          // matches LK.island's dock end
const DEFAULT_AIM = Math.atan2(H * 0.68 - LAMP.y, W * 0.8 - LAMP.x);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (dt, tau) => 1 - Math.exp(-dt / tau);

// ---------- noise + dithering (same maths as lk-kit.js) ----------
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => (BAYER[y & 3][x & 3] + 0.5) / 16;
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 982451653) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0; h = h ^ (h >>> 16);
  return ((h >>> 0) % 10000) / 10000;
}
function vnoise(x, y, sc, s) {
  const fx = x / sc, fy = y / sc, ix = Math.floor(fx), iy = Math.floor(fy);
  let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
}
const fbm = (x, y, s) => vnoise(x * 0.6, y, 22, s) * 0.65 + vnoise(x, y, 9, s + 5) * 0.35;

// Fog noise is fixed for the night, so bake it once.
function bakeNoise(seed) {
  const N = { n: new Float32Array(W * H), nb: new Float32Array(W * H), n2: new Float32Array(W * H),
    depth: new Float32Array(W * H), star: new Float32Array(W * H) };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    N.n[i] = fbm(x, y, seed);
    N.nb[i] = vnoise(x * 0.3, y, 5, seed + 1) * 0.6 + vnoise(x * 0.15, y, 12, seed + 2) * 0.4;
    N.n2[i] = vnoise(x, y * 1.6, 7, seed + 3) * 0.5 + N.n[i] * 0.5;
    N.depth[i] = y < HZ ? 0.12 : 0.12 * (1 - (y - HZ) / (H - HZ));
    N.star[i] = hash(x, y, 3);
  }
  return N;
}

// ---------- storage (family's own past nights) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('lk.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lk.' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- attention input: headset over the bridge, or the Space-bar simulator ----------
const IN = { att: null, poor: null, last: 0, bridge: false, simAtt: 20, space: false, simFrost: false, simSig: 0 };
if (location.protocol.startsWith('http')) {
  const es = new EventSource('/events');
  es.onerror = () => { IN.bridge = false; };
  es.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'bridge') { IN.bridge = msg.status === 'connected'; return; }
    if (msg.type === 'pilot-cmd') { onPilotCmd(msg.cmd); return; }
    if (msg.type !== 'packet') return;
    const d = msg.data;
    if (d.eSense) { IN.att = d.eSense.attention ?? IN.att; IN.last = performance.now(); }
    if ('poorSignalLevel' in d) { IN.poor = d.poorSignalLevel; IN.last = performance.now(); }
  };
}
const headsetLive = () => !IN.space && performance.now() - IN.last < 3000 && IN.poor != null;
function reading() {
  if (headsetLive()) {
    const ok = IN.poor < 200 && IN.att != null;
    return { att: ok ? IN.att : null, poor: IN.poor, q: IN.poor >= 200 ? 0 : clamp(1 - IN.poor / 200, 0, 1) };
  }
  const poor = IN.simFrost ? 120 : Math.round((1 - IN.simSig) * 120);   // frost clears as the simulated headset settles
  return { att: IN.simAtt, poor, q: 1 - poor / 200 };
}

// ---------- state ----------
let S, P, C, N, ctx;
const K = {};
function newNight() {
  S = {
    stage: 'lighting', tide: 0, T: 0, stageT: 0, paused: false, theme: null,
    boats: [], sel: null, rocks: [], buoys: [], channel: null, passengers: 0, boatsHome: 0,
    beam: { level: 0, aim: DEFAULT_AIM, aboveSince: null, steady: false, count: 0, flareUntil: 0, flare: 0, lowSince: 0, eff: 0, dawnMix: 0 },
    dens: 0.72, hist: [], histT: 0, tideStats: null, pending: { threshold: CFG.threshold, holdSec: CFG.holdSec },
    highContrast: store.get('highContrast', false), guide: { text: '', until: 0 }, nextSpawn: 0,
    channelOnce: false, summaryShown: false, dawnPick: null, snap: null, transT0: 0, transDur: 1.5, sun: 0, stormAmt: 0, lastNow: null,
    layout: 1, curAmt: 0,
  };
  N = bakeNoise(1 + Math.floor(Math.random() * 900));
  makeNightRocks();
  $('dawn').classList.add('hidden');
  setStage('lighting');
}

// ---------- palette ----------
const palCache = {};
function palette(theme) {
  if (!palCache[theme]) {
    const p = LK.pal(theme), rgb = {};
    LK.KEYS.forEach(k => { rgb[k] = LK.parse(p[k]); });
    palCache[theme] = { p, rgb };
  }
  return palCache[theme];
}
const themeFor = stage => S.highContrast ? CFG.highContrastTheme : CFG.stagePalettes[stage];
function applyTheme(theme) {
  if (theme === S.theme) return;
  if (S.theme && ctx) { S.snap = ctx.getImageData(0, 0, W, H); S.transT0 = performance.now(); S.transDur = S.stage === 'dawn' ? CFG.dawnFadeSec : CFG.fadeSec; }
  S.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  ({ p: P, rgb: C } = palette(theme));
  drawIcons();
}

// ---------- bay layouts (one per tide; the storm keeps tide 3's) ----------
// Islands come from design-system/data/islands.json, placed by their top-left corner in art pixels.
// clear: spots rocks keep away from, so the lanes around the islands stay open.
const LAYOUTS = {
  1: { islands: [], clear: [] },                                                              // open water
  2: { islands: [{ id: 'twin', x: 124, y: 72 }, { id: 'pebble', x: 170, y: 103 }],            // small and medium: go above or below
       clear: [[141, 66], [141, 95], [178, 95], [160, 120]] },
  3: { islands: [{ id: 'forest', x: 120, y: 58 }, { id: 'ruins', x: 128, y: 98 }],            // two large islands, a gap in the middle
       clear: [[148, 89], [142, 56], [146, 124]] },
};
// each island's solid footprint (top + cliff), the same shape LK.drawIsland draws
const ISLE = {};
function isleShape(id) {
  if (ISLE[id]) return ISLE[id];
  const I = LK.DATA.islands.find(i => i.id === id);
  const inE = (e, x, y) => ((x - e[0]) / e[2]) ** 2 + ((y - e[1]) / e[3]) ** 2 <= 1;
  const top = (x, y) => x >= 0 && y >= 0 && x < I.w && y < I.h && I.blobs.some(e => inE(e, x, y)) && !(I.holes || []).some(e => inE(e, x, y));
  const w = I.w, h = I.h + I.cliff, solid = new Uint8Array(w * h);
  let sx = 0, sy = 0, n = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let on = top(x, y);
    for (let k = 1; !on && k <= I.cliff; k++) on = top(x, y - k);
    if (on) { solid[y * w + x] = 1; sx += x; sy += y; n++; }
  }
  return ISLE[id] = { I, w, h, solid, cx: sx / n, cy: sy / n };
}
const bayLayout = () => LAYOUTS[S.layout] || LAYOUTS[1];
function onFeature(x, y) {
  for (const i of bayLayout().islands) {
    const sh = isleShape(i.id), lx = Math.round(x - i.x), ly = Math.round(y - i.y);
    if (lx >= 0 && ly >= 0 && lx < sh.w && ly < sh.h && sh.solid[ly * sh.w + lx]) return true;
  }
  return false;
}
// points along a boat's hull, so wide boats can't clip an island
function hullOnFeature(x, y, w, h) {
  const hw = Math.max(0, w / 2 - 1), yb = y + h / 2 - 1;
  return [[x - hw, yb], [x, yb], [x + hw, yb], [x - hw, y], [x + hw, y], [x, y]].some(([a, b]) => onFeature(a, b));
}
// rocks keep away from land and never block the gaps boats need
const rockSpotBad = (x, y) => [[0, 0], [6, 0], [-6, 0], [0, 5], [0, -5]].some(([a, b]) => onFeature(x + a, y + b))
  || bayLayout().clear.some(([cx, cy]) => distTo(cx, cy, x, y) < 16);
function setLayout(n) {
  S.layout = n;
  S.rocks = S.rocks.filter(r => !rockSpotBad(r.x, r.y));
  makeNightRocks();
  // any boat now sitting on new land moves to the nearest open water
  for (const b of S.boats) {
    if (b.state !== 'sea' && b.state !== 'hidden') continue;
    if (!onLand(b.x, b.y, b.w, b.h)) continue;
    outer: for (let r = 2; r < 60; r += 2) for (let a = 0; a < 16; a++) {
      const x = b.x + Math.cos(a * Math.PI / 8) * r, y = b.y + Math.sin(a * Math.PI / 8) * r;
      if (x < b.w / 2 + 1 || x > W - b.w / 2 - 1 || y > H - b.h / 2 - 1 || onLand(x, y, b.w, b.h)) continue;
      b.x = x; b.y = y; b.trail = []; break outer;
    }
  }
}

// ---------- rocks, boats, channel ----------
const distTo = (a, b, x, y) => Math.hypot(a - x, b - y);
function makeNightRocks() {
  for (let tries = 0; S.rocks.length < 7 && tries < 400; tries++) {
    const x = Math.round(rand(85, 215)), y = Math.round(rand(HZ + 12, 126));
    if (S.rocks.some(r => distTo(r.x, r.y, x, y) < 20) || distTo(DOCK.x, DOCK.y, x, y) < 26 || rockSpotBad(x, y)) continue;
    S.rocks.push({ x, y, revealed: false, splashUntil: 0 });
  }
}
// rock (x,y) is its 8×4 sprite's centre
function rockHits(r, cx, cy, hw, hh) { return Math.abs(cx - r.x) < 4 + hw - 2 && Math.abs(cy + hh * 0.3 - r.y) < 5; }

// the ferry is drawn on the kit's grid with the kit's colour roles
const EXTRA_SPRITES = {
  ferry: [
    '.......o..........',
    '......owo.........',
    '...oooooooooooo...',
    '...owlwwlwwlwwo...',
    '...owwwwwwwwwwo...',
    'ohhhhhhhhhhhhhhhho',
    '.oHHHHHHHHHHHHHHo.',
    '..oooooooooooooo..'],
};
const spriteOf = type => EXTRA_SPRITES[type] || LK.SPRITES[type];
function pickType() {
  const mix = CFG.boatMix[S.tide] || CFG.boatMix[1];
  let r = Math.random();
  for (const [t, w] of Object.entries(mix)) if ((r -= w) < 0) return t;
  return Object.keys(mix)[0];
}
function makeBoat(type, x, y) {
  const sz = LK.spriteSize(spriteOf(type));
  return { type, x, y, w: sz.w, h: sz.h, passengers: CFG.passengers[type], state: 'sea', left: true,
    trail: [], pauseUntil: 0, status: 'ready', dockT: 0, slotX: 0, slotY: 0 };
}
// New boats sail in from the right edge to a waiting spot at the fog edge.
function spawnBoat() {
  for (let tries = 0; tries < 60; tries++) {
    const x = Math.round(rand(200, 224)), y = Math.round(rand(HZ + 12, 124));   // waiting spot near the right edge
    if (S.boats.some(b => ['sea', 'arriving', 'hidden'].includes(b.state) && (distTo(b.x, b.y, x, y) < 18 || (b.x > x - 12 && Math.abs(b.y - y) < 12)))) continue;  // spot and lane are clear
    if (S.rocks.some(r => distTo(r.x, r.y, x, y) < 14)) continue;
    const b = makeBoat(pickType(), x, y);
    if (onLand(x, y, b.w, b.h)) continue;
    b.state = 'arriving'; b.waitX = x; b.x = W + b.w / 2 - 3;   // bow already peeking in at the edge
    S.boats.push(b);
    return true;
  }
  return false;
}
// Tide 3 hides a ferry in the fog; only a steady beam (or a flare) finds it.
function hideFerry() {
  for (let tries = 0; tries < 80; tries++) {
    const x = Math.round(rand(186, 222)), y = Math.round(rand(HZ + 14, 122));
    const f = makeBoat('ferry', x, y);
    if (onLand(x, y, f.w, f.h) || S.rocks.some(r => distTo(r.x, r.y, x, y) < 16)) continue;
    if (S.boats.some(b => b.state !== 'docked' && distTo(b.x, b.y, x, y) < 22)) continue;
    f.state = 'hidden';
    S.boats.push(f);
    return;
  }
}
const seaBoats = () => S.boats.filter(b => b.state === 'sea');
const activeBoats = () => S.boats.filter(b => b.state === 'sea' || b.state === 'arriving');
const selected = () => (S.sel && S.sel.state === 'sea') ? S.sel : null;
function selectNext(dir = 1) {
  const list = seaBoats();
  if (!list.length) { S.sel = null; return; }
  const i = list.indexOf(S.sel);
  S.sel = list[(i + dir + list.length) % list.length];
}
function autoSelect() {
  if (selected()) return;
  const list = seaBoats();
  S.sel = list.find(b => b.type === 'storm') || list[0] || null;
}

function onLand(x, y, hw, h = 2) {
  if (y < HZ + 4) return true;
  if (hullOnFeature(x, y, hw, h)) return true;
  const r = y - BY;
  if (r >= -2 && r <= 10 && Math.abs(x - BX) < 15 + 1.4 * Math.max(0, r) + 2 + hw * 0.5) return true;
  if (y < BY && Math.abs(x - BX) < 8 + hw * 0.5) return true;
  return false;
}
function inDock(b) {
  const big = b.type === 'storm';
  return b.x > DOCK.x - (big ? 30 : 24) && b.x < DOCK.x + (big ? 20 : 8) && b.y > DOCK.y - (big ? 8 : 6) && b.y < DOCK.y + (big ? 16 : 12);
}

function distToSeg(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], t = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / (dx * dx + dy * dy), 0, 1);
  return Math.hypot(px - a[0] - dx * t, py - a[1] - dy * t);
}
const distToPath = (pts, x, y) => Math.min(...pts.slice(1).map((p, i) => distToSeg(x, y, pts[i], p)));

function startStorm() {
  const ship = makeBoat('storm', 204, 66);
  ship.state = 'arriving'; ship.waitX = 204; ship.x = W + ship.w / 2 - 3;   // sails in out of the storm

// ---------- stages ----------

// ---------- main update ----------

  IN.simSig = Math.min(1, IN.simSig + dt / 5);        // simulated headset settles over ~5 s
  const r = reading();

  updateBeam(r, dt);

  if (S.stage === 'tide') {

    if (S.histT >= 0.5) { S.histT = 0; S.hist.push({ t: S.stageT, a: r.att }); S.tideStats.total++; if (r.att != null && r.att >= CFG.threshold) S.tideStats.above++; }

  LK.island(ctx, p, BX, BY);
  drawBay(p);
  const lampLit = S.stage === 'lighting' ? 0.6 * (S.reading ? S.reading.q : 0) : S.beam.eff;
  LK.lighthouse(ctx, p, BX, BY, CFG.lighthouse, lampLit, frosty());
  // decorations the Keeper chose on past nights
  store.get('owned', []).forEach(k => { const at = DECO_AT[k]; if (at) LK.drawSprite(ctx, LK.SPRITES[k], BX + at[0], BY + at[1], p); });

  // rocks stay on the chart once a steady beam has found them
  for (const r of S.rocks) {
    const x0 = r.x - 4, y0 = r.y - 2;
    if (r.revealed) {
      for (let f = -2; f < 10; f++) if ((f & 1) === 0) px(p.crest, x0 + f, y0 + 4);
      LK.drawSprite(ctx, LK.SPRITES.rock, x0, y0, p);
    } else if (T < r.splashUntil) {
      for (let f = -1; f < 9; f += 2) px(p.crest, x0 + f, y0 + 2 + ((f + Math.floor(T * 4)) & 1));
    }
  }
  // channel buoys (storm)
  for (const u of S.buoys) if (u.revealed) {
    px(p.outline, u.x - 1, u.y - 4, 3, 5); px(p.outline, u.x, u.y - 5);
    px(p.lamp, u.x, u.y - 6); px(p.tower, u.x, u.y - 3); px(p.stripe, u.x, u.y - 2); px(p.tower, u.x, u.y - 1);
    px(p.crest, u.x - 2, u.y + 1); px(p.crest, u.x + 2, u.y + 1);
  }
  // dock marker (the Pilot's goal)
  if (S.stage === 'tide' || S.stage === 'storm') { px(p.route, DOCK.x + 2, DOCK.y - 1, 3, 3); px(p.outline, DOCK.x + 3, DOCK.y, 1, 1); }

  const sel = selected();
  for (const b of S.boats) {
    if (b.state === 'hidden') { px(LK.mix(p.lamp, p.fog, 0.6), Math.round(b.x), Math.round(b.y - b.h / 2) - 1); continue; }
    // the Pilot's route: a dashed wake behind the boat
    b.trail.forEach((t, k) => { if (k % 5 < 3) px(p.route, t[0], t[1]); });
    const spr = spriteOf(b.type), x0 = Math.round(b.x - b.w / 2), y0 = Math.round(b.y - b.h / 2);
    const inLight = (b.state !== 'sea' && b.state !== 'arriving') || S.stage === 'dawn' || boatLit(b);
    LK.drawSprite(ctx, spr, x0, y0, p, inLight ? { flip: b.left } : { dim: 0.6, dimTo: 'fog', flip: b.left });
    if (!inLight) { px(p.lamp, x0 + Math.floor(b.w / 2), y0 - 2); px(LK.mix(p.lamp, p.fog, 0.5), x0 + Math.floor(b.w / 2), y0 - 1); }
    for (let f = 0; f < b.w; f += 3) px(p.crest, x0 + f, y0 + b.h);
    if (b === sel && (S.stage === 'tide' || S.stage === 'storm')) {
      const mx = x0 + Math.floor(b.w / 2), my = y0 - 10;     // 9-wide arrow, outlined so it reads on every fog colour
      for (let r = 0; r < 5; r++) { px(p.outline, mx - 4 + r, my + r, 9 - r * 2, 1); if (r < 4) px(p.stripe, mx - 3 + r, my + r, 7 - r * 2, 1); }
      px(p.outline, mx - 4, my - 1, 9, 1);
    }
  }
  // steady-beam sparkles
  if (S.beam.steady && S.beam.flare < 0.5 && S.stage !== 'lighting') {
    const a = S.beam.eff, half = 0.035 + 0.3 * a, len = W * (0.32 + 0.78 * a);
    [0.35, 0.55, 0.75].forEach((f, i) => {
      const gx = Math.round(LAMP.x + Math.cos(S.beam.aim + (i - 1) * half * 0.5) * len * f), gy = Math.round(LAMP.y + Math.sin(S.beam.aim + (i - 1) * half * 0.5) * len * f);
      px(p['beam-core'], gx, gy - 1); px(p['beam-core'], gx - 1, gy, 3, 1); px(p['beam-core'], gx, gy + 1);
    });
  }
  if (S.stage === 'dawn' || S.stage === 'end') {
    LK.drawSprite(ctx, LK.SPRITES.gull, Math.round(W * 0.48), Math.round(H * 0.16), p);
    LK.drawSprite(ctx, LK.SPRITES.gull, Math.round(W * 0.56), Math.round(H * 0.22), p);
  }
}

// palette changes between stages dissolve through the Bayer pattern (no flash)
function dissolve() {
  if (!S.snap) return;
  const t = (performance.now() - S.transT0) / 1000 / S.transDur;
  if (t >= 1) { S.snap = null; return; }
  const cur = ctx.getImageData(0, 0, W, H), o = S.snap.data, n = cur.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (bay(x, y) < t) continue;
    const k = (y * W + x) * 4; n[k] = o[k]; n[k + 1] = o[k + 1]; n[k + 2] = o[k + 2];
  }
  ctx.putImageData(cur, 0, 0);
}

const frosty = () => S.reading && S.reading.poor != null && S.reading.poor > CFG.frostAbove;

function render(now) {
  renderBackground(now);
  renderSprites();
  dissolve();
}

// ---------- HUD (corners only) ----------
const setText = (el, t) => { if (el.textContent !== t) el.textContent = t; };
const setHTML = (el, h) => { if (el._h !== h) { el._h = h; el.innerHTML = h; } };
function drawIcons() {
  const b = $('boatIcon'); b.innerHTML = '';
  b.appendChild(LK.spriteCanvas(9, 5, 4, (c, p) => LK.drawSprite(c, LK.SPRITES.row, 0, 0, p)));
  const g = $('guideAvatar'); g.innerHTML = '';
  g.appendChild(LK.spriteCanvas(14, 21, 4, (c, p) => LK.avatar(c, 1, 1, p, {})));
  $('bubble')._h = null;
}
function frostIcon() {
  const cv = LK.spriteCanvas(10, 9, 3, (c, p) => {
    LK.px(c, p.outline, 0, 0, 10, 9); LK.px(c, p.lamp, 1, 1, 8, 7);
    for (let y = 1; y < 8; y++) for (let x = 1; x < 9; x++) if (y === 1 || x === 1 || x === 8 || (x + y) % 3 === 0) LK.px(c, p.frost, x, y);
  });
  return cv;
}

const CALM_LINES = ['Sit tall, feet flat, hands resting in your lap.', 'Keep your eyes on the light.', 'Breathe slowly and watch the beam grow.', 'Shoulders soft, back tall, like a lighthouse.'];
function guideText() {
  if (frosty()) return { frost: true, text: 'Lamp is frosty — grown-up, check the headset' };
  if (S.T < S.guide.until) return { text: S.guide.text };
  const st = S.stage;
  if (st === 'lighting') return { text: S.reading && S.reading.q >= 0.75 ? 'The lamp is ready. Sit tall and keep your eyes on the light.' : 'Sit tall. The lamp is warming up.' };
  if (st === 'calm') return { text: CALM_LINES[Math.floor(S.stageT / 12) % CALM_LINES.length] };
  if ((st === 'tide' || st === 'storm') && S.T - S.beam.lowSince > 8) return { text: 'Sit tall and keep your eyes on the light.' };
  return null;
}

function updateHUD() {
  const st = S.stage, inPlay = st === 'calm' || st === 'tide' || st === 'storm';
  setText($('stageName'), st === 'tide' ? `Tide ${S.tide}` : STAGE_NAME[st]);
  [...$('ticks').children].forEach((el, i) => {
    const done = i < S.tide - (st === 'tide' ? 1 : 0) || st === 'storm' || st === 'dawn' || st === 'end';
    el.classList.toggle('on', done);
    el.firstChild.style.width = (!done && st === 'tide' && i === S.tide - 1) ? Math.min(100, S.stageT / CFG.durations.tide * 100).toFixed(1) + '%' : '0';
  });
  $('hudTR').classList.toggle('hidden', !inPlay);
  const n = S.beam.flare > 0.5 ? 3 : S.beam.count;
  document.querySelectorAll('.pip').forEach((el, i) => el.classList.toggle('on', i < n));
  $('hudBL').classList.toggle('hidden', st === 'lighting' || st === 'calm');
  setText($('homeText'), `${S.boatsHome} home`);
  const g = (st === 'dawn' && S.summaryShown) ? null : guideText();
  $('hudBR').classList.toggle('hidden', !g);
  if (g) setHTML($('bubble'), g.frost ? `<span class="frost" id="frostWrap"></span>` : escapeHTML(g.text));
  if (g && g.frost && !$('frostWrap').childElementCount) { $('frostWrap').appendChild(frostIcon()); $('frostWrap').append(g.text); }
  $('pause').classList.toggle('hidden', !S.paused);
  const hint = st === 'lighting' ? `Grown-ups: open ${location.host || 'the bridge'}/pilot, or press Enter to start.`
    : st === 'end' ? 'Grown-ups: press Enter for a new night.' : '';
  $('hudHint').classList.toggle('hidden', !hint);
  setText($('hudHint'), hint);
}
const escapeHTML = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- link to the Pilot page (relayed through bridge.py) ----------
const RELAY = location.protocol.startsWith('http');
let lastPost = 0;
function pilotState() {
  const r = S.reading || {}, b = selected(), ferry = S.boats.find(o => o.type === 'ferry');
  return {
    stage: S.stage, tide: S.tide, tides: CFG.tides, stageT: S.stageT, durations: CFG.durations, paused: S.paused,
    boatsHome: S.boatsHome, passengers: S.passengers, onWater: activeBoats().length,
    steady: S.beam.count, steadyForFlare: CFG.steadyForFlare, flare: S.beam.flare > 0.5,
    attention: r.att ?? null, poor: r.poor ?? null, headset: headsetLive(), bridgeOn: IN.bridge, simFrost: IN.simFrost,
    threshold: CFG.threshold, holdSec: CFG.holdSec, pending: S.pending, highContrast: S.highContrast,
    tideStats: S.tideStats, summaryShown: S.summaryShown, layout: S.layout, current: currentOn(),
    ferry: !ferry ? (S.tide >= CFG.ferryTide ? 'home' : 'none') : ferry.state === 'hidden' ? 'hidden' : ferry.state === 'docked' ? 'home' : 'found',
    marked: b ? { type: b.type, status: b.status, passengers: b.passengers } : null,
  };
}
function publish(force) {
  if (!RELAY || !S) return;
  const now = performance.now();
  if (!force && now - lastPost < 250) return;
  lastPost = now;
  fetch('/pilot/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pilotState()) }).catch(() => {});
}
function onPilotCmd(c) {
  if (!S || !c) return;
  if (c.cmd === 'next') { S.paused = false; nextStage(); }
  else if (c.cmd === 'pause') { if (['calm', 'tide', 'storm'].includes(S.stage)) S.paused = !S.paused; }
  else if (c.cmd === 'frost') IN.simFrost = !IN.simFrost;
  else if (c.cmd === 'settings') {
    // threshold and hold time wait for the next tide, so the Keeper isn't interrupted
    if (Number.isFinite(c.threshold)) S.pending.threshold = clamp(Math.round(c.threshold), 10, 90);
    if ([2, 3, 4].includes(c.holdSec)) S.pending.holdSec = c.holdSec;
    if (typeof c.highContrast === 'boolean' && c.highContrast !== S.highContrast) {
      S.highContrast = c.highContrast; store.set('highContrast', S.highContrast);
      if (!['calm', 'tide', 'storm'].includes(S.stage)) applyTheme(themeFor(S.stage));   // otherwise from the next stage
    }
  }
  publish(true);
}

// ---------- Dawn: team summary + decorations ----------
function showDawn() {
  if (S.summaryShown) return;
  S.summaryShown = true;
  const n = S.passengers, last = store.get('lastNight', null), earned = Math.floor(n / 2);
  store.set('lastNight', n);
  store.set('stars', store.get('stars', 0) + earned);
  const cmp = last == null ? `<p class="same">Your first night at the harbour.</p>` :
    n > last ? `<p class="up"><span aria-hidden="true">▲</span> ${n - last} more than last night</p>` :
    n === last ? `<p class="same">Just like last night.</p>` : `<p class="same">Every boat came home safely.</p>`;
  const d = $('dawn');
  d.innerHTML = `
    <h1 class="game-title">Dawn!</h1>
    <p class="big">Together you brought ${n} passenger${n === 1 ? '' : 's'} home.</p>
    ${cmp}
    <div class="stars"><span id="starIcon"></span><span id="starText"></span></div>
    <div class="small">Pick a decoration for the lighthouse, then press Decorate.</div>
    <div class="shop" id="shop"></div>
    <div class="btns"><button class="lk-btn" id="decorate">Decorate</button><button class="lk-btn secondary" id="goodnight">Goodnight</button></div>`;
  d.classList.remove('hidden');
  $('starIcon').appendChild(LK.spriteCanvas(7, 5, 4, (c, p) => LK.drawSprite(c, LK.SPRITES.star, 0, 0, p)));
  $('decorate').onclick = () => {
    const pick = SHOP.find(s => s[0] === S.dawnPick), stars = store.get('stars', 0), owned = store.get('owned', []);
    if (!pick || owned.includes(pick[0]) || stars < pick[2]) return;
    store.set('stars', stars - pick[2]); store.set('owned', [...owned, pick[0]]); S.dawnPick = null;
    say(`The ${pick[1].toLowerCase()} looks lovely on the lighthouse.`, 5);
    renderShop();
  };
  $('goodnight').onclick = () => { d.classList.add('hidden'); setStage('end'); };
  renderShop();
  publish(true);
  $('decorate').focus({ preventScroll: true });
}
function renderShop() {
  const stars = store.get('stars', 0), owned = store.get('owned', []);
  setText($('starText'), `${stars} sea star${stars === 1 ? '' : 's'} to spend`);
  const shop = $('shop'); shop.innerHTML = '';
  SHOP.forEach(([key, name, cost]) => {
    const have = owned.includes(key), can = !have && stars >= cost;
    const el = document.createElement('button');
    el.className = 'item lk-panel' + (S.dawnPick === key ? ' picked' : '') + (can || have ? '' : ' cant');
    const spr = LK.SPRITES[key], sz = LK.spriteSize(spr);
    el.appendChild(LK.spriteCanvas(18, 10, 3, (c, p) => LK.drawSprite(c, spr, Math.floor((18 - sz.w) / 2), Math.floor((10 - sz.h) / 2), p)));
    const nm = document.createElement('div'); nm.textContent = name;
    const sm = document.createElement('small'); sm.textContent = have ? 'On the lighthouse' : `${cost} stars`;
    el.append(nm, sm);
    el.onclick = () => { if (can) { S.dawnPick = key; renderShop(); } };
    shop.appendChild(el);
  });
}

// ---------- keys ----------
const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
addEventListener('keydown', e => {
  const tag = e.target.tagName, inInput = tag === 'INPUT';
  if (ARROWS.includes(e.key)) { if (inInput) return; K[e.key] = true; e.preventDefault(); return; }
  if (e.key === ' ') { if (inInput) return; IN.space = true; e.preventDefault(); return; }
  if (e.key === 'Tab' && (S.stage === 'tide' || S.stage === 'storm')) { selectNext(e.shiftKey ? -1 : 1); e.preventDefault(); return; }
  if (e.key === 'Escape' && (S.stage === 'calm' || S.stage === 'tide' || S.stage === 'storm')) { S.paused = !S.paused; publish(true); return; }
  if (e.key === 'Enter' && tag !== 'BUTTON' && ['lighting', 'rest', 'end'].includes(S.stage)) { nextStage(); return; }
  if ((e.key === 'n' || e.key === 'N') && !inInput && S.stage !== 'end') { S.paused = false; nextStage(); return; }
  if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); return; }
  if ((e.key === 'i' || e.key === 'I') && !headsetLive()) { IN.simFrost = !IN.simFrost; publish(true); return; }
});
addEventListener('keyup', e => {
  if (ARROWS.includes(e.key)) K[e.key] = false;
  if (e.key === ' ') { IN.space = false; if (e.target.tagName === 'BUTTON') e.preventDefault(); }
});
addEventListener('blur', () => { ARROWS.forEach(k => K[k] = false); IN.space = false; });

// ---------- layout + loop ----------
function fit() {
  const s = Math.max(1, Math.min(Math.floor(innerWidth / W), Math.floor(innerHeight / H)));
  const cv = $('c');
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  // the HUD is drawn for 4x; it grows with the scene on big screens and never drops below 16px text
  const z = String(Math.max(1, s / 4));
  document.querySelectorAll('.hud, .dawn, .pause').forEach(el => { el.style.zoom = z; });
}
addEventListener('resize', fit);

let prev = null;
function frame(ts) {
  const now = ts / 1000, dt = prev == null ? 0 : Math.min(0.1, now - prev); prev = now;
  if (!S.paused) { S.T += dt; S.stageT += dt; update(dt); }
  render(now);
  updateHUD(); publish();
  requestAnimationFrame(frame);
}

LK.ready(() => {
  const cv = $('c'); cv.width = W; cv.height = H;
  ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  img = ctx.createImageData(W, H);
  newNight();
  S.reading = reading();
  fit();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
