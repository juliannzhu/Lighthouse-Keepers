<!doctype html>
<html lang="en">
<head>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../lk-kit.css">
<script src="../lk-kit.js"></script>

<meta charset="utf-8">
<title>Islands</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-read); }
  .wrap { padding: var(--space-4); }
  h2 { font-family: var(--font-pixel); font-weight: 600; font-size: 24px; line-height: 30px; margin: var(--space-4) 0 var(--space-2); }
  .grid { display: grid; gap: var(--space-4); }
  .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } .g5 { grid-template-columns: repeat(5, 1fr); }
  .card { background: var(--surface-raised); border: 1px solid var(--border); padding: var(--space-2); }
  canvas { width: 100%; height: auto; image-rendering: pixelated; display: block; }
  h3 { font-family: var(--font-pixel); font-weight: 600; font-size: 18px; line-height: 24px; margin: var(--space-2) 0 2px; }
  p { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="wrap" id="out"></div>
<script>
  var GROUPS = [['small', 'Small islands', 'g3', [36, 22]], ['medium', 'Medium islands', 'g4', [48, 28]], ['large', 'Large islands', 'g5', [56, 36]]];
  function draw() {
    var out = document.getElementById('out'); out.innerHTML = '';
    GROUPS.forEach(function (g) {
      var h = document.createElement('h2'); h.textContent = g[1]; out.appendChild(h);
      var grid = document.createElement('div'); grid.className = 'grid ' + g[2]; out.appendChild(grid);
      LK.DATA.islands.filter(function (i) { return i.size === g[0]; }).forEach(function (I) {
        var W = g[3][0], H = g[3][1];
        var cv = LK.spriteCanvas(W, H, 1, function (ctx, p) {
          for (var y = 0; y < H; y++) { ctx.fillStyle = y % 6 === 3 ? LK.mix(p.sea, p['sea-light'], 0.35) : p.sea; ctx.fillRect(0, y, W, 1); }
          LK.drawIsland(ctx, p, I.id, Math.floor((W - I.w) / 2), Math.floor((H - I.h - I.cliff) / 2) + 2, { lit: true });
        });
        cv.style.width = '100%'; cv.style.height = 'auto';
        var c = document.createElement('div'); c.className = 'card'; c.appendChild(cv);
        var t = document.createElement('h3'); t.textContent = I.name; c.appendChild(t);
        var p = document.createElement('p'); p.textContent = I.role; c.appendChild(p);
        grid.appendChild(c);
      });
    });
  }
  LK.ready(draw); LK.onTheme(draw);
</script>
</body>
</html>
