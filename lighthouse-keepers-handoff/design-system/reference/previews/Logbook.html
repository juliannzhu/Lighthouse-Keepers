<!doctype html>
<html lang="en">
<head>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../lk-kit.css">
<script src="../lk-kit.js"></script>

<meta charset="utf-8">
<title>Logbook</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-pixel); }
  .top { display: flex; align-items: baseline; gap: var(--space-4); padding: var(--space-4) var(--space-4) 0; }
  .top h1 { margin: 0; flex: 1; }
  .top span { font-size: 18px; color: var(--ink-muted); }
  h2 { font-size: 20px; line-height: 26px; margin: var(--space-4) var(--space-4) var(--space-2); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); padding: 0 var(--space-4); }
  .b { display: grid; grid-template-columns: 64px 1fr; gap: var(--space-2); align-items: center; padding: var(--space-2); background: var(--surface-raised); border: 2px solid var(--border); }
  .b.done { border-color: var(--success); }
  .b canvas { image-rendering: pixelated; display: block; }
  .n { font-size: 16px; line-height: 20px; }
  .t { font-family: var(--font-read); font-size: 12px; line-height: 16px; color: var(--ink-muted); }
  .bar { display: flex; gap: 2px; margin-top: 4px; }
  .bar i { flex: 1; height: 6px; background: var(--border); }
  .bar i.on { background: var(--success); }
  .cnt { font-size: 13px; color: var(--ink-muted); }
  .done .cnt { color: var(--success); }
</style>
</head>
<body>
<div class="top"><h1 class="game-heading">Keeper's Logbook</h1><span id="sum"></span></div>
<div id="out"></div>
<script>
  function draw() {
    var out = document.getElementById('out'); out.innerHTML = '';
    var B = LK.DATA.badges, got = B.filter(function (b) { return b.have >= b.goal; }).length;
    document.getElementById('sum').textContent = got + ' of ' + B.length + ' badges';
    var groups = []; B.forEach(function (b) { if (groups.indexOf(b.group) < 0) groups.push(b.group); });
    groups.forEach(function (g) {
      var h = document.createElement('h2'); h.textContent = g; out.appendChild(h);
      var grid = document.createElement('div'); grid.className = 'grid'; out.appendChild(grid);
      B.filter(function (b) { return b.group === g; }).forEach(function (b) {
        var done = b.have >= b.goal, el = document.createElement('div'); el.className = 'b' + (done ? ' done' : '');
        el.appendChild(LK.spriteCanvas(20, 20, 3, function (ctx, p) { LK.badge(ctx, p, b, 1, 1, done); }));
        var info = document.createElement('div');
        info.innerHTML = '<div class="n"></div><div class="t"></div><div class="bar"></div><div class="cnt"></div>';
        info.querySelector('.n').textContent = b.name;
        info.querySelector('.t').textContent = b.text;
        var bar = info.querySelector('.bar'), segs = 8, on = Math.round(Math.min(1, b.have / b.goal) * segs);
        for (var i = 0; i < segs; i++) { var s = document.createElement('i'); if (i < on) s.className = 'on'; bar.appendChild(s); }
        info.querySelector('.cnt').textContent = done ? '✓ ' + b.tier + ' badge' : Math.min(b.have, b.goal) + ' / ' + b.goal;
        el.appendChild(info); grid.appendChild(el);
      });
    });
  }
  LK.ready(draw); LK.onTheme(draw);
</script>
</body>
</html>
